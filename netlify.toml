# Netlify settings for the MVM GROUP website.
# Netlify provides hosting, free SSL (HTTPS), form handling and CMS sign-in.

[build]
  command = "node scripts/build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Send visitors from the bare domain to their language.
[[redirects]]
  from = "/"
  to = "/la/"
  status = 302
  force = true
  conditions = { Language = ["lo"] }

[[redirects]]
  from = "/"
  to = "/zh/"
  status = 302
  force = true
  conditions = { Language = ["zh"] }

# Short language aliases people may type.
[[redirects]]
  from = "/lo/*"
  to = "/la/:splat"
  status = 301

[[redirects]]
  from = "/cn/*"
  to = "/zh/:splat"
  status = 301

# Language-specific "page not found".
[[redirects]]
  from = "/la/*"
  to = "/la/404/"
  status = 404

[[redirects]]
  from = "/zh/*"
  to = "/zh/404/"
  status = 404

[[redirects]]
  from = "/en/*"
  to = "/en/404/"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
