en:
  title: Business & Government Services
  summary: Consulting, government documentation, and translation for companies and investors in Laos.
  description: |-
    This unit helps companies and investors set up and operate in Laos. We advise on business structure and market entry, prepare and follow up government documents and permits, and provide translation and interpretation in Lao, Chinese, Thai and English.

    Most clients use more than one of these services at the same time, so one coordinator manages the whole file.
  icon: briefcase
  status: active
  show_in_menu: true
  order: 1
