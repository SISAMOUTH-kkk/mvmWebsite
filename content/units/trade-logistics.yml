en:
  title: Trade & Logistics
  summary: Import-export, customs, shipping and product distribution between Laos and international markets.
  description: |-
    This unit moves goods in and out of Laos and gets them to market. We coordinate shipping, customs clearance and cross-border transport, and we trade and distribute products through a growing network of agents and retailers.
