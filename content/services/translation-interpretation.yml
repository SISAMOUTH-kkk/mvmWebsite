en:
  title: Translation & Interpretation
  summary: Document translation and interpreters for Lao, Chinese, Thai and English.
  icon: translate
  unit: business-services
  quote_option: translation
  order: 4
  image: ""
  seo_title: Lao, Chinese, Thai and English translation and interpreters
  seo_description: >-
    Translation of business, legal and personal documents and interpreters for meetings, sites and events
    in Lao, Chinese, Thai and English.
  intro: |-
    We translate business, legal and personal documents between Lao, Chinese, Thai and English, and provide interpreters for meetings, negotiations, site visits and events.

    Translators work into their native language. Documents for government submission are formatted to match the original, with certification arranged when the receiving office requires it.
  audience:
    - Companies preparing contracts, licences or tenders in Laos
    - Investors meeting Lao partners or officials
    - Factories and projects with Chinese and Lao teams on site
    - Individuals with personal documents for visas, study or marriage
    - Event organisers and business delegations
  help:
    - title: Document translation
      text: Contracts, company documents, licences, certificates, manuals and marketing material.
    - title: Official document formatting
      text: Translations laid out to match the original for submission to authorities.
    - title: Meeting interpretation
      text: Consecutive interpreting for meetings, negotiations and government appointments.
    - title: Site and factory interpreting
      text: Interpreters who work on construction sites, in factories and on field visits.
    - title: Event and conference support
      text: Interpreters and bilingual hosts for launches, seminars and delegations.
    - title: Proofreading and localisation
      text: Reviewing existing translations and adapting websites, labels and packaging.
  process:
    - title: Send your files or event details
      text: Share documents, or the date, place and topic of the meeting.
    - title: Quotation
      text: We quote by page, word count or interpreter day, with the delivery date.
    - title: Translation or briefing
      text: A native-speaking translator works on the file, or the interpreter is briefed on your topic and terms.
    - title: Review
      text: A second linguist checks names, numbers and terminology.
    - title: Delivery
      text: You receive the files in Word or PDF, with printed or certified copies if needed.
  documents:
    - Clear scans or photos of every page to be translated
    - Spelling of names as shown on passports
    - Glossary or previous translations (if you have them)
    - Meeting agenda, presentation or technical terms (for interpreting)
  timeline:
    - item: Standard documents (1–5 pages)
      duration: 1–2 working days
    - item: Longer documents
      duration: Quoted by volume
    - item: Interpreter booking
      duration: 3+ days in advance
    - item: Urgent work
      duration: Same or next day, on request
  faq:
    - question: Which language pairs do you cover?
      answer: Lao, Chinese (Mandarin), Thai and English in any combination. Ask us about other languages.
    - question: Are your translations accepted by Lao authorities?
      answer: We format official translations for government submission and arrange certification when the receiving office asks for it. Requirements differ by office, so we check them first.
    - question: Can I book an interpreter for several days or outside Vientiane?
      answer: Yes. Interpreters can travel with you, and travel and accommodation are included in the quotation.
    - question: Is my document kept confidential?
      answer: Yes. Files are only shared with the people working on your job, and we can sign a confidentiality agreement.
la:
  title: ແປພາສາ ແລະ ລ່າມ
  summary: ແປເອກະສານ ແລະ ບໍລິການລ່າມ ພາສາລາວ, ຈີນ, ໄທ ແລະ ອັງກິດ.
  seo_title: ບໍລິການແປພາສາ ແລະ ລ່າມ ລາວ, ຈີນ, ໄທ ແລະ ອັງກິດ
  seo_description: >-
    ແປເອກະສານທຸລະກິດ, ກົດໝາຍ ແລະ ເອກະສານສ່ວນຕົວ ພ້ອມບໍລິການລ່າມສຳລັບການປະຊຸມ, ໜ້າວຽກ ແລະ ງານຕ່າງໆ
    ເປັນພາສາລາວ, ຈີນ, ໄທ ແລະ ອັງກິດ.
  intro: |-
    ພວກເຮົາແປເອກະສານທຸລະກິດ, ກົດໝາຍ ແລະ ເອກະສານສ່ວນຕົວ ລະຫວ່າງພາສາລາວ, ຈີນ, ໄທ ແລະ ອັງກິດ ແລະ ໃຫ້ບໍລິການລ່າມສຳລັບການປະຊຸມ, ການເຈລະຈາ, ການລົງພື້ນທີ່ ແລະ ງານຕ່າງໆ.

    ນັກແປຂອງພວກເຮົາແປເປັນພາສາແມ່ຂອງຕົນ. ເອກະສານທີ່ຈະຍື່ນຕໍ່ພາກລັດ ຈະຖືກຈັດຮູບແບບໃຫ້ກົງກັບຕົ້ນສະບັບ ພ້ອມຈັດການການຢັ້ງຢືນ ເມື່ອຫ້ອງການທີ່ຮັບເອກະສານຕ້ອງການ.
  audience:
    - ບໍລິສັດທີ່ກະກຽມສັນຍາ, ໃບອະນຸຍາດ ຫຼື ເອກະສານປະມູນໃນລາວ
    - ນັກລົງທຶນທີ່ພົບປະຄູ່ຮ່ວມງານ ຫຼື ເຈົ້າໜ້າທີ່ລາວ
    - ໂຮງງານ ແລະ ໂຄງການທີ່ມີທີມງານຈີນ ແລະ ລາວ ເຮັດວຽກຮ່ວມກັນ
    - ບຸກຄົນທີ່ມີເອກະສານສ່ວນຕົວ ສຳລັບວີຊາ, ການສຶກສາ ຫຼື ການແຕ່ງງານ
    - ຜູ້ຈັດງານ ແລະ ຄະນະຜູ້ແທນທາງທຸລະກິດ
  help:
    - title: ແປເອກະສານ
      text: ສັນຍາ, ເອກະສານບໍລິສັດ, ໃບອະນຸຍາດ, ໃບຢັ້ງຢືນ, ຄູ່ມື ແລະ ເອກະສານການຕະຫຼາດ.
    - title: ຈັດຮູບແບບເອກະສານທາງການ
      text: ຈັດຮູບແບບຄຳແປໃຫ້ກົງກັບຕົ້ນສະບັບ ເພື່ອຍື່ນຕໍ່ເຈົ້າໜ້າທີ່.
    - title: ລ່າມໃນການປະຊຸມ
      text: ລ່າມແບບຕໍ່ເນື່ອງສຳລັບການປະຊຸມ, ການເຈລະຈາ ແລະ ການພົບປະເຈົ້າໜ້າທີ່.
    - title: ລ່າມໜ້າວຽກ ແລະ ໂຮງງານ
      text: ລ່າມທີ່ເຮັດວຽກຢູ່ສະຖານທີ່ກໍ່ສ້າງ, ໃນໂຮງງານ ແລະ ການລົງພື້ນທີ່.
    - title: ສະໜັບສະໜູນງານ ແລະ ກອງປະຊຸມ
      text: ລ່າມ ແລະ ພິທີກອນສອງພາສາ ສຳລັບງານເປີດຕົວ, ການສຳມະນາ ແລະ ຄະນະຜູ້ແທນ.
    - title: ກວດທານ ແລະ ປັບໃຫ້ເໝາະກັບທ້ອງຖິ່ນ
      text: ກວດທານຄຳແປທີ່ມີຢູ່ແລ້ວ ແລະ ປັບເນື້ອຫາເວັບໄຊ, ສະຫຼາກ ແລະ ບັນຈຸພັນ.
  process:
    - title: ສົ່ງໄຟລ໌ ຫຼື ລາຍລະອຽດງານ
      text: ສົ່ງເອກະສານ ຫຼື ວັນທີ, ສະຖານທີ່ ແລະ ຫົວຂໍ້ຂອງການປະຊຸມ.
    - title: ໃບສະເໜີລາຄາ
      text: ພວກເຮົາສະເໜີລາຄາຕາມໜ້າ, ຈຳນວນຄຳ ຫຼື ຕາມມື້ຂອງລ່າມ ພ້ອມວັນສົ່ງມອບ.
    - title: ແປ ຫຼື ກຽມຂໍ້ມູນ
      text: ນັກແປທີ່ເປັນເຈົ້າຂອງພາສາແປເອກະສານ ຫຼື ລ່າມຮັບຂໍ້ມູນກ່ຽວກັບຫົວຂໍ້ ແລະ ຄຳສັບຂອງທ່ານລ່ວງໜ້າ.
    - title: ກວດທານ
      text: ນັກພາສາຄົນທີສອງກວດຊື່, ຕົວເລກ ແລະ ຄຳສັບສະເພາະ.
    - title: ສົ່ງມອບ
      text: ທ່ານຈະໄດ້ຮັບໄຟລ໌ Word ຫຼື PDF ພ້ອມສະບັບພິມ ຫຼື ສະບັບຢັ້ງຢືນ ຖ້າຕ້ອງການ.
  documents:
    - ສະແກນ ຫຼື ຮູບຖ່າຍທີ່ຊັດເຈນຂອງທຸກໜ້າທີ່ຕ້ອງການແປ
    - ການສະກົດຊື່ຕາມໜັງສືຜ່ານແດນ
    - ລາຍການຄຳສັບ ຫຼື ຄຳແປເກົ່າ (ຖ້າມີ)
    - ວາລະການປະຊຸມ, ເອກະສານນຳສະເໜີ ຫຼື ຄຳສັບເຕັກນິກ (ສຳລັບລ່າມ)
  timeline:
    - item: ເອກະສານທົ່ວໄປ (1–5 ໜ້າ)
      duration: 1–2 ວັນລັດຖະການ
    - item: ເອກະສານຍາວ
      duration: ສະເໜີລາຄາຕາມປະລິມານ
    - item: ຈອງລ່າມ
      duration: ລ່ວງໜ້າ 3 ວັນຂຶ້ນໄປ
    - item: ວຽກດ່ວນ
      duration: ພາຍໃນມື້ດຽວ ຫຼື ມື້ຖັດໄປ ຕາມການຮ້ອງຂໍ
  faq:
    - question: ທ່ານໃຫ້ບໍລິການຄູ່ພາສາໃດແດ່?
      answer: ພາສາລາວ, ຈີນ (ຈີນກາງ), ໄທ ແລະ ອັງກິດ ໃນທຸກຄູ່ພາສາ. ສອບຖາມພວກເຮົາສຳລັບພາສາອື່ນໆ.
    - question: ຄຳແປຂອງທ່ານໄດ້ຮັບການຍອມຮັບຈາກເຈົ້າໜ້າທີ່ລາວບໍ?
      answer: ພວກເຮົາຈັດຮູບແບບຄຳແປທາງການເພື່ອຍື່ນຕໍ່ພາກລັດ ແລະ ຈັດການການຢັ້ງຢືນເມື່ອຫ້ອງການທີ່ຮັບເອກະສານຮ້ອງຂໍ. ເງື່ອນໄຂແຕກຕ່າງກັນໄປຕາມແຕ່ລະຫ້ອງການ, ສະນັ້ນ ພວກເຮົາຈະກວດສອບກ່ອນ.
    - question: ສາມາດຈອງລ່າມຫຼາຍມື້ ຫຼື ໄປນອກວຽງຈັນໄດ້ບໍ?
      answer: ໄດ້. ລ່າມສາມາດເດີນທາງໄປກັບທ່ານ ໂດຍລວມຄ່າເດີນທາງ ແລະ ທີ່ພັກໄວ້ໃນໃບສະເໜີລາຄາ.
    - question: ເອກະສານຂອງຂ້ອຍຖືກຮັກສາເປັນຄວາມລັບບໍ?
      answer: ແມ່ນ. ໄຟລ໌ຈະຖືກແບ່ງປັນສະເພາະຜູ້ທີ່ເຮັດວຽກຂອງທ່ານ ແລະ ພວກເຮົາສາມາດເຊັນສັນຍາຮັກສາຄວາມລັບໄດ້.
zh:
  title: 翻译与口译
  summary: 老挝语、中文、泰语和英语的文件翻译及口译服务。
  seo_title: 老挝语、中文、泰语、英语翻译与口译
  seo_description: 提供老挝语、中文、泰语和英语的商务、法律及个人文件翻译，以及会议、现场和活动口译。
  intro: |-
    我们提供老挝语、中文、泰语和英语之间的商务、法律及个人文件翻译，并为会议、谈判、现场考察和各类活动提供口译服务。

    译员均译入其母语。用于政府递交的文件将按原件格式排版，并在接收部门要求时安排认证。
  audience:
    - 在老挝准备合同、执照或投标文件的企业
    - 与老挝合作伙伴或官员会面的投资者
    - 中老双方团队共同工作的工厂和项目
    - 办理签证、留学或婚姻手续需要翻译个人文件的人士
    - 活动主办方和商务代表团
  help:
    - title: 文件翻译
      text: 合同、公司文件、执照、证书、说明书及营销资料。
    - title: 官方文件排版
      text: 按原件格式排版译文，便于向政府部门递交。
    - title: 会议口译
      text: 为会议、谈判及政府约见提供交替传译。
    - title: 现场与工厂口译
      text: 可在施工现场、工厂及实地考察中工作的口译员。
    - title: 活动与会议支持
      text: 为发布会、研讨会和代表团提供口译员及双语主持人。
    - title: 校对与本地化
      text: 审校现有译文，并对网站、标签和包装进行本地化。
  process:
    - title: 发送文件或活动信息
      text: 提供需翻译的文件，或会议的日期、地点和主题。
    - title: 报价
      text: 我们按页数、字数或口译天数报价，并注明交付日期。
    - title: 翻译或译前准备
      text: 由母语译员翻译文件，或由口译员提前熟悉您的主题和术语。
    - title: 审校
      text: 第二位语言专家核对人名、数字和专业术语。
    - title: 交付
      text: 您将收到 Word 或 PDF 文件，如有需要可提供纸质版或认证件。
  documents:
    - 每页待译文件的清晰扫描件或照片
    - 与护照一致的姓名拼写
    - 术语表或以往译文（如有）
    - 会议议程、演示文稿或技术术语（口译服务）
  timeline:
    - item: 普通文件（1–5 页）
      duration: 1–2 个工作日
    - item: 较长文件
      duration: 按工作量报价
    - item: 预约口译员
      duration: 提前 3 天以上
    - item: 加急服务
      duration: 当日或次日，视需求安排
  faq:
    - question: 你们提供哪些语种？
      answer: 老挝语、中文（普通话）、泰语和英语，可任意组合。其他语种请咨询。
    - question: 你们的译文会被老挝政府部门接受吗？
      answer: 我们按政府递交要求排版官方译文，并在接收部门要求时安排认证。各部门要求不同，我们会事先确认。
    - question: 可以预约多天或到万象以外地区的口译员吗？
      answer: 可以。口译员可随行，差旅和住宿费用包含在报价中。
    - question: 我的文件会保密吗？
      answer: 会。文件仅提供给参与项目的人员，我们也可以签署保密协议。
