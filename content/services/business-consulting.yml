en:
  title: Business Consulting
  summary: Advice on investment, company setup and entering the Lao market.
  icon: compass
  unit: business-services
  quote_option: business-consulting
  order: 3
  image: ""
  seo_title: Business consulting and company setup in Laos
  seo_description: >-
    Market entry, company registration, licences and investment advice for foreign and Lao businesses.
    MVM GROUP advises and then handles setup in Laos.
  intro: |-
    Starting or expanding a business in Laos means dealing with new laws, licences, partners and customers at the same time. Our consultants help you make decisions with local information, then turn the plan into a registered, working operation.

    We advise foreign investors, regional companies and Lao businesses on market entry, company structure, licensing routes and partner selection. We stay with you through setup, so advice and execution come from the same team.
  audience:
    - Foreign investors exploring Laos for the first time
    - Chinese, Thai and regional companies opening a branch or subsidiary
    - Lao businesses planning to expand, partner or seek investment
    - Factories and traders looking for suppliers, land or distribution in Laos
    - Business owners who need a local partner to manage day-to-day setup
  help:
    - title: Market entry assessment
      text: Market size, competitors, customers and regulations for your sector, summarised in a short decision report.
    - title: Company structure and registration
      text: Choosing between a branch, representative office, wholly owned company or joint venture, and handling registration.
    - title: Licences and approvals
      text: Mapping which business licences, sector approvals and permits you need, and in what order.
    - title: Partner and location search
      text: Finding and checking local partners, suppliers, offices, warehouses or land.
    - title: Investment incentives
      text: Reviewing whether your project may qualify for promotion zones or incentives, and what it takes to apply.
    - title: Ongoing business support
      text: Annual renewals, compliance calendars, meetings with authorities and day-to-day problem solving.
  process:
    - title: Initial consultation
      text: We discuss your goals, budget and timeline by phone, WeChat, WhatsApp or in person.
    - title: Proposal and quotation
      text: You receive a written scope with deliverables, timeline, required documents and fees.
    - title: Research and planning
      text: Our team gathers information, meets the right offices and prepares the plan or report.
    - title: Implementation
      text: We register, apply and coordinate with authorities and partners on your behalf.
    - title: Handover and follow-up
      text: You receive all documents and a compliance calendar, and we remain available for renewals and next steps.
  documents:
    - Passport copies of shareholders and directors
    - Company documents of the parent company (for corporate investors)
    - Short business plan or project description
    - Proposed company name, capital and business activities
    - Office or site lease agreement (when available)
    - Bank reference or proof of funds (for some activities)
  timeline:
    - item: Initial consultation
      duration: 1–3 working days
    - item: Market entry report
      duration: 2–4 weeks
    - item: Company registration (general business)
      duration: 4–8 weeks
    - item: Sector licences and approvals
      duration: Quoted per case
  faq:
    - question: Can a foreign company own 100% of a business in Laos?
      answer: In many sectors yes, but some activities have ownership limits or require a Lao partner. We check the current rules for your activity before you commit.
    - question: Do I need to travel to Laos to set up a company?
      answer: Not always. Many steps can be handled under a power of attorney, but some signatures or bank procedures may require a visit. We plan the visit so it is as short as possible.
    - question: Can you act as our local representative after setup?
      answer: Yes. We provide ongoing support for renewals, reporting, meetings with authorities and local coordination.
    - question: How do you charge?
      answer: Consulting is quoted per project or as a monthly retainer. Contact us for a quotation based on your scope.
la:
  title: ທີ່ປຶກສາທຸລະກິດ
  summary: ຄຳປຶກສາດ້ານການລົງທຶນ, ການຈັດຕັ້ງບໍລິສັດ ແລະ ການເຂົ້າສູ່ຕະຫຼາດລາວ.
  seo_title: ທີ່ປຶກສາທຸລະກິດ ແລະ ການຈັດຕັ້ງບໍລິສັດໃນ ສປປ ລາວ
  seo_description: >-
    ການເຂົ້າສູ່ຕະຫຼາດ, ການຈົດທະບຽນບໍລິສັດ, ໃບອະນຸຍາດ ແລະ ຄຳປຶກສາດ້ານການລົງທຶນ ສຳລັບທຸລະກິດຕ່າງປະເທດ ແລະ ທຸລະກິດລາວ.
  intro: |-
    ການເລີ່ມ ຫຼື ຂະຫຍາຍທຸລະກິດໃນ ສປປ ລາວ ໝາຍເຖິງການຮັບມືກັບກົດໝາຍ, ໃບອະນຸຍາດ, ຄູ່ຮ່ວມງານ ແລະ ລູກຄ້າໃໝ່ໃນເວລາດຽວກັນ. ທີ່ປຶກສາຂອງພວກເຮົາຊ່ວຍໃຫ້ທ່ານຕັດສິນໃຈດ້ວຍຂໍ້ມູນທ້ອງຖິ່ນ ແລ້ວປ່ຽນແຜນການໃຫ້ກາຍເປັນທຸລະກິດທີ່ຈົດທະບຽນ ແລະ ດຳເນີນງານໄດ້ຈິງ.

    ພວກເຮົາໃຫ້ຄຳປຶກສາແກ່ນັກລົງທຶນຕ່າງປະເທດ, ບໍລິສັດໃນພາກພື້ນ ແລະ ທຸລະກິດລາວ ກ່ຽວກັບການເຂົ້າສູ່ຕະຫຼາດ, ໂຄງສ້າງບໍລິສັດ, ຂັ້ນຕອນການຂໍໃບອະນຸຍາດ ແລະ ການເລືອກຄູ່ຮ່ວມງານ. ພວກເຮົາຢູ່ກັບທ່ານຕະຫຼອດການສ້າງຕັ້ງ ເພື່ອໃຫ້ຄຳປຶກສາ ແລະ ການປະຕິບັດມາຈາກທີມດຽວກັນ.
  audience:
    - ນັກລົງທຶນຕ່າງປະເທດທີ່ກຳລັງສຶກສາຕະຫຼາດລາວເປັນຄັ້ງທຳອິດ
    - ບໍລິສັດຈີນ, ໄທ ແລະ ບໍລິສັດໃນພາກພື້ນ ທີ່ຕ້ອງການເປີດສາຂາ ຫຼື ບໍລິສັດລູກ
    - ທຸລະກິດລາວທີ່ວາງແຜນຂະຫຍາຍ, ຮ່ວມມື ຫຼື ຊອກຫາການລົງທຶນ
    - ໂຮງງານ ແລະ ພໍ່ຄ້າ ທີ່ຊອກຫາຜູ້ສະໜອງ, ທີ່ດິນ ຫຼື ຊ່ອງທາງຈັດຈຳໜ່າຍໃນລາວ
    - ເຈົ້າຂອງທຸລະກິດທີ່ຕ້ອງການຄູ່ຮ່ວມງານທ້ອງຖິ່ນ ເພື່ອດູແລວຽກສ້າງຕັ້ງປະຈຳວັນ
  help:
    - title: ການປະເມີນການເຂົ້າສູ່ຕະຫຼາດ
      text: ຂະໜາດຕະຫຼາດ, ຄູ່ແຂ່ງ, ລູກຄ້າ ແລະ ລະບຽບການໃນຂະແໜງຂອງທ່ານ ສະຫຼຸບເປັນບົດລາຍງານສັ້ນເພື່ອການຕັດສິນໃຈ.
    - title: ໂຄງສ້າງ ແລະ ການຈົດທະບຽນບໍລິສັດ
      text: ເລືອກລະຫວ່າງສາຂາ, ຫ້ອງການຜູ້ຕາງໜ້າ, ບໍລິສັດທີ່ຖືຫຸ້ນທັງໝົດ ຫຼື ການຮ່ວມທຶນ ແລະ ດຳເນີນການຈົດທະບຽນ.
    - title: ໃບອະນຸຍາດ ແລະ ການອະນຸມັດ
      text: ກຳນົດວ່າທ່ານຕ້ອງການໃບອະນຸຍາດທຸລະກິດ, ການອະນຸມັດຂະແໜງການ ແລະ ໃບອະນຸຍາດອື່ນໆໃດແດ່ ແລະ ຕາມລຳດັບໃດ.
    - title: ຊອກຫາຄູ່ຮ່ວມງານ ແລະ ສະຖານທີ່
      text: ຊອກຫາ ແລະ ກວດສອບຄູ່ຮ່ວມງານທ້ອງຖິ່ນ, ຜູ້ສະໜອງ, ຫ້ອງການ, ສາງ ຫຼື ທີ່ດິນ.
    - title: ສິດທິພິເສດດ້ານການລົງທຶນ
      text: ກວດສອບວ່າໂຄງການຂອງທ່ານອາດມີສິດໄດ້ຮັບການສົ່ງເສີມ ຫຼື ສິດທິພິເສດໃດແດ່ ແລະ ຕ້ອງເຮັດແນວໃດເພື່ອຍື່ນຂໍ.
    - title: ການສະໜັບສະໜູນທຸລະກິດຕໍ່ເນື່ອງ
      text: ການຕໍ່ອາຍຸປະຈຳປີ, ປະຕິທິນການປະຕິບັດຕາມລະບຽບ, ການພົບປະເຈົ້າໜ້າທີ່ ແລະ ການແກ້ໄຂບັນຫາປະຈຳວັນ.
  process:
    - title: ປຶກສາເບື້ອງຕົ້ນ
      text: ພວກເຮົາປຶກສາກ່ຽວກັບເປົ້າໝາຍ, ງົບປະມານ ແລະ ໄລຍະເວລາຂອງທ່ານ ຜ່ານທາງໂທລະສັບ, WeChat, WhatsApp ຫຼື ພົບກັນໂດຍກົງ.
    - title: ຂໍ້ສະເໜີ ແລະ ໃບສະເໜີລາຄາ
      text: ທ່ານຈະໄດ້ຮັບຂອບເຂດວຽກເປັນລາຍລັກອັກສອນ ພ້ອມຜົນງານທີ່ຈະສົ່ງມອບ, ໄລຍະເວລາ, ເອກະສານທີ່ຕ້ອງໃຊ້ ແລະ ຄ່າບໍລິການ.
    - title: ຄົ້ນຄວ້າ ແລະ ວາງແຜນ
      text: ທີມງານຂອງພວກເຮົາເກັບກຳຂໍ້ມູນ, ພົບປະຫ້ອງການທີ່ກ່ຽວຂ້ອງ ແລະ ກະກຽມແຜນການ ຫຼື ບົດລາຍງານ.
    - title: ດຳເນີນການ
      text: ພວກເຮົາຈົດທະບຽນ, ຍື່ນຄຳຮ້ອງ ແລະ ປະສານງານກັບເຈົ້າໜ້າທີ່ ແລະ ຄູ່ຮ່ວມງານແທນທ່ານ.
    - title: ສົ່ງມອບ ແລະ ຕິດຕາມ
      text: ທ່ານຈະໄດ້ຮັບເອກະສານທັງໝົດ ພ້ອມປະຕິທິນການປະຕິບັດຕາມລະບຽບ ແລະ ພວກເຮົາພ້ອມຊ່ວຍເລື່ອງການຕໍ່ອາຍຸ ແລະ ຂັ້ນຕອນຕໍ່ໄປ.
  documents:
    - ສຳເນົາໜັງສືຜ່ານແດນຂອງຜູ້ຖືຫຸ້ນ ແລະ ຜູ້ອຳນວຍການ
    - ເອກະສານຂອງບໍລິສັດແມ່ (ສຳລັບນັກລົງທຶນທີ່ເປັນນິຕິບຸກຄົນ)
    - ແຜນທຸລະກິດສັ້ນ ຫຼື ຄຳອະທິບາຍໂຄງການ
    - ຊື່ບໍລິສັດທີ່ສະເໜີ, ທຶນຈົດທະບຽນ ແລະ ກິດຈະການທຸລະກິດ
    - ສັນຍາເຊົ່າຫ້ອງການ ຫຼື ສະຖານທີ່ (ຖ້າມີ)
    - ໜັງສືຢັ້ງຢືນຈາກທະນາຄານ ຫຼື ຫຼັກຖານແຫຼ່ງທຶນ (ສຳລັບບາງກິດຈະການ)
  timeline:
    - item: ປຶກສາເບື້ອງຕົ້ນ
      duration: 1–3 ວັນລັດຖະການ
    - item: ບົດລາຍງານການເຂົ້າສູ່ຕະຫຼາດ
      duration: 2–4 ອາທິດ
    - item: ຈົດທະບຽນບໍລິສັດ (ທຸລະກິດທົ່ວໄປ)
      duration: 4–8 ອາທິດ
    - item: ໃບອະນຸຍາດ ແລະ ການອະນຸມັດຂະແໜງການ
      duration: ສະເໜີລາຄາຕາມແຕ່ລະກໍລະນີ
  faq:
    - question: ບໍລິສັດຕ່າງປະເທດສາມາດຖືຫຸ້ນ 100% ໃນທຸລະກິດທີ່ລາວໄດ້ບໍ?
      answer: ໃນຫຼາຍຂະແໜງການແມ່ນໄດ້, ແຕ່ບາງກິດຈະການມີຂໍ້ຈຳກັດການຖືຫຸ້ນ ຫຼື ຕ້ອງມີຄູ່ຮ່ວມງານລາວ. ພວກເຮົາຈະກວດສອບລະບຽບການປັດຈຸບັນສຳລັບກິດຈະການຂອງທ່ານ ກ່ອນທ່ານຕັດສິນໃຈ.
    - question: ຂ້ອຍຕ້ອງເດີນທາງມາລາວ ເພື່ອສ້າງຕັ້ງບໍລິສັດບໍ?
      answer: ບໍ່ຈຳເປັນສະເໝີໄປ. ຫຼາຍຂັ້ນຕອນສາມາດດຳເນີນການໂດຍໃບມອບສິດ, ແຕ່ບາງການລົງລາຍເຊັນ ຫຼື ຂັ້ນຕອນທະນາຄານອາດຕ້ອງມາດ້ວຍຕົນເອງ. ພວກເຮົາຈະວາງແຜນໃຫ້ການເດີນທາງສັ້ນທີ່ສຸດ.
    - question: ຫຼັງສ້າງຕັ້ງແລ້ວ ທ່ານສາມາດເປັນຕົວແທນທ້ອງຖິ່ນໃຫ້ພວກເຮົາໄດ້ບໍ?
      answer: ໄດ້. ພວກເຮົາໃຫ້ການສະໜັບສະໜູນຕໍ່ເນື່ອງ ທັງການຕໍ່ອາຍຸ, ການລາຍງານ, ການພົບປະເຈົ້າໜ້າທີ່ ແລະ ການປະສານງານທ້ອງຖິ່ນ.
    - question: ຄິດຄ່າບໍລິການແນວໃດ?
      answer: ການໃຫ້ຄຳປຶກສາຄິດລາຄາຕາມໂຄງການ ຫຼື ເປັນລາຍເດືອນ. ກະລຸນາຕິດຕໍ່ພວກເຮົາເພື່ອຂໍໃບສະເໜີລາຄາຕາມຂອບເຂດວຽກຂອງທ່ານ.
zh:
  title: 商务咨询
  summary: 提供投资、公司设立及进入老挝市场的专业建议。
  seo_title: 老挝商务咨询与公司设立
  seo_description: 为外资及老挝企业提供市场进入、公司注册、许可证办理及投资咨询。MVM 集团从咨询到落地全程负责。
  intro: |-
    在老挝创业或拓展业务，意味着要同时应对新的法律、许可、合作伙伴和客户。我们的顾问以本地信息帮助您做出决策，并将计划落实为已注册、可运营的业务。

    我们为外国投资者、区域企业和老挝本地企业提供市场进入、公司架构、许可路径及合作伙伴选择等方面的咨询，并在设立过程中全程陪伴，确保建议与执行由同一团队负责。
  audience:
    - 首次考察老挝市场的外国投资者
    - 计划在老挝设立分公司或子公司的中国、泰国及区域企业
    - 计划扩张、合作或寻求投资的老挝企业
    - 在老挝寻找供应商、土地或销售渠道的工厂和贸易商
    - 需要本地合作伙伴处理日常设立事务的企业主
  help:
    - title: 市场进入评估
      text: 针对您所在行业的市场规模、竞争对手、客户和法规，形成简明的决策报告。
    - title: 公司架构与注册
      text: 在分公司、代表处、独资公司或合资企业之间做出选择，并办理注册手续。
    - title: 许可与审批
      text: 梳理您需要哪些营业执照、行业审批和许可证，以及办理顺序。
    - title: 寻找合作伙伴与选址
      text: 寻找并核实本地合作伙伴、供应商、办公室、仓库或土地。
    - title: 投资优惠政策
      text: 评估您的项目是否可能享受开发区或投资优惠政策，以及申请所需条件。
    - title: 持续经营支持
      text: 年度续期、合规日程、与政府部门会面以及日常问题处理。
  process:
    - title: 初步咨询
      text: 通过电话、微信、WhatsApp 或面谈，了解您的目标、预算和时间安排。
    - title: 方案与报价
      text: 您将收到书面的工作范围，包括交付内容、时间、所需文件和费用。
    - title: 调研与规划
      text: 我们的团队收集信息、拜访相关部门，并准备方案或报告。
    - title: 执行落地
      text: 我们代表您办理注册、提交申请，并与政府部门和合作伙伴协调。
    - title: 交付与跟进
      text: 您将收到全部文件和合规日程表，后续续期及下一步工作我们随时支持。
  documents:
    - 股东及董事护照复印件
    - 母公司的公司文件（适用于法人投资者）
    - 简要商业计划或项目说明
    - 拟定公司名称、注册资本及经营范围
    - 办公室或场地租赁合同（如已有）
    - 银行资信证明或资金证明（部分行业需要）
  timeline:
    - item: 初步咨询
      duration: 1–3 个工作日
    - item: 市场进入报告
      duration: 2–4 周
    - item: 公司注册（一般行业）
      duration: 4–8 周
    - item: 行业许可与审批
      duration: 视具体情况报价
  faq:
    - question: 外国公司可以在老挝 100% 控股吗？
      answer: 许多行业可以，但部分行业有持股限制或需要老挝合作方。我们会在您做出决定前，核实您所在行业的现行规定。
    - question: 设立公司必须亲自到老挝吗？
      answer: 不一定。许多步骤可通过授权委托办理，但部分签字或银行手续可能需要本人到场。我们会尽量缩短您的行程。
    - question: 公司设立后，你们可以担任我们的本地代表吗？
      answer: 可以。我们提供续期、报告、对接政府部门及本地协调等持续支持。
    - question: 如何收费？
      answer: 咨询服务按项目或月度顾问形式报价。请联系我们，根据您的需求获取报价。
