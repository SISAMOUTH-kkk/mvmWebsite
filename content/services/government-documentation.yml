en:
  title: Government Documentation
  summary: Licences, permits, business documents and coordination with Lao government offices.
  icon: document
  unit: business-services
  quote_option: government-documentation
  order: 2
  image: ""
  seo_title: Government documents, licences and permits in Laos
  seo_description: >-
    Business licences, renewals, work and stay permits, company changes, certification and government liaison
    in Laos, handled by MVM GROUP.
  intro: |-
    Government paperwork in Laos involves several offices, forms in Lao and requirements that change. We prepare complete files, submit them, follow up with the responsible offices and keep you informed until the document is issued.

    Clients use us for new licences and renewals, work and stay permits for foreign staff, company changes, and the many supporting letters and certificates that day-to-day business requires.
  audience:
    - Foreign-owned companies operating in Laos
    - Lao businesses that need licences renewed or updated
    - Employers bringing foreign staff to Laos
    - Investors applying for sector approvals
    - Individuals who need official documents prepared or legalised
  help:
    - title: Business licences and renewals
      text: Enterprise registration updates, annual renewals and licence amendments.
    - title: Work and stay permits
      text: Applications and renewals for foreign employees and their families.
    - title: Company changes
      text: Changes of address, directors, shareholders, capital or business activities.
    - title: Sector permits
      text: Import licences, operating permits and other approvals specific to your industry.
    - title: Certification and legalisation
      text: Certified copies, notarisation and consular legalisation of documents for use in Laos or abroad.
    - title: Government liaison
      text: Accompanying you to meetings and following up on files with ministries and provincial offices.
  process:
    - title: Tell us what you need
      text: Share the document or permit you need and your current situation.
    - title: Checklist and quotation
      text: We send a checklist of required documents, the expected timeline and our fee.
    - title: File preparation
      text: We complete forms in Lao, check every document and arrange translations or certifications.
    - title: Submission and follow-up
      text: We submit the file and follow up with the responsible office until it is approved.
    - title: Delivery
      text: You receive the original documents, copies and reminders for future renewal dates.
  documents:
    - Enterprise registration certificate and current licences
    - Passport and visa copies (for permits involving foreign nationals)
    - Company seal and authorised signatory details
    - Power of attorney for MVM GROUP to act on your behalf
    - Supporting letters, contracts or certificates relevant to the application
    - Recent photographs (for personal permits)
  timeline:
    - item: Document review
      duration: 1–2 working days
    - item: Renewals and simple amendments
      duration: 1–3 weeks
    - item: Work and stay permits
      duration: 2–6 weeks
    - item: New licences and sector permits
      duration: Quoted per case
  faq:
    - question: Can you handle documents in provinces outside Vientiane?
      answer: Yes. We coordinate with provincial offices and plan site visits when an office requires them.
    - question: My documents are in Chinese or English. Is that a problem?
      answer: No. Our translation team prepares Lao translations, and we arrange certification or legalisation when the office requires it.
    - question: Do you guarantee approval?
      answer: Approval is the decision of the authority. We make sure your file is complete and correct, follow it closely and tell you early if anything is missing.
    - question: Can you remind us when licences are due for renewal?
      answer: Yes. We keep a renewal calendar for regular clients and contact you before deadlines.
la:
  title: ບໍລິການເອກະສານທາງລັດ
  summary: ໃບອະນຸຍາດ, ໃບຢັ້ງຢືນ, ເອກະສານທຸລະກິດ ແລະ ການປະສານງານກັບຫ້ອງການລັດ.
  seo_title: ເອກະສານທາງລັດ, ໃບອະນຸຍາດ ແລະ ການຕໍ່ອາຍຸໃນ ສປປ ລາວ
  seo_description: >-
    ໃບອະນຸຍາດທຸລະກິດ, ການຕໍ່ອາຍຸ, ໃບອະນຸຍາດເຮັດວຽກ ແລະ ບັດພັກເຊົາ, ການປ່ຽນແປງຂໍ້ມູນບໍລິສັດ,
    ການຢັ້ງຢືນເອກະສານ ແລະ ການປະສານງານກັບພາກລັດ ໂດຍ MVM GROUP.
  intro: |-
    ວຽກເອກະສານທາງລັດໃນ ສປປ ລາວ ກ່ຽວຂ້ອງກັບຫຼາຍຫ້ອງການ, ແບບຟອມເປັນພາສາລາວ ແລະ ເງື່ອນໄຂທີ່ມີການປ່ຽນແປງ. ພວກເຮົາກະກຽມເອກະສານໃຫ້ຄົບຖ້ວນ, ຍື່ນ, ຕິດຕາມກັບຫ້ອງການທີ່ຮັບຜິດຊອບ ແລະ ແຈ້ງຄວາມຄືບໜ້າໃຫ້ທ່ານຮູ້ ຈົນກວ່າຈະໄດ້ຮັບເອກະສານ.

    ລູກຄ້າໃຊ້ບໍລິການຂອງພວກເຮົາສຳລັບໃບອະນຸຍາດໃໝ່ ແລະ ການຕໍ່ອາຍຸ, ໃບອະນຸຍາດເຮັດວຽກ ແລະ ບັດພັກເຊົາສຳລັບພະນັກງານຕ່າງປະເທດ, ການປ່ຽນແປງຂໍ້ມູນບໍລິສັດ ແລະ ໜັງສືຢັ້ງຢືນຕ່າງໆທີ່ທຸລະກິດຕ້ອງໃຊ້ປະຈຳວັນ.
  audience:
    - ບໍລິສັດທີ່ມີຜູ້ຖືຫຸ້ນຕ່າງປະເທດ ທີ່ດຳເນີນທຸລະກິດໃນລາວ
    - ທຸລະກິດລາວທີ່ຕ້ອງການຕໍ່ອາຍຸ ຫຼື ປັບປຸງໃບອະນຸຍາດ
    - ນາຍຈ້າງທີ່ນຳພະນັກງານຕ່າງປະເທດເຂົ້າມາເຮັດວຽກໃນລາວ
    - ນັກລົງທຶນທີ່ຍື່ນຂໍການອະນຸມັດຂະແໜງການ
    - ບຸກຄົນທີ່ຕ້ອງການກະກຽມ ຫຼື ຮັບຮອງເອກະສານທາງການ
  help:
    - title: ໃບອະນຸຍາດທຸລະກິດ ແລະ ການຕໍ່ອາຍຸ
      text: ການປັບປຸງໃບທະບຽນວິສາຫະກິດ, ການຕໍ່ອາຍຸປະຈຳປີ ແລະ ການແກ້ໄຂໃບອະນຸຍາດ.
    - title: ໃບອະນຸຍາດເຮັດວຽກ ແລະ ບັດພັກເຊົາ
      text: ການຍື່ນຂໍ ແລະ ການຕໍ່ອາຍຸ ສຳລັບພະນັກງານຕ່າງປະເທດ ແລະ ຄອບຄົວ.
    - title: ການປ່ຽນແປງຂໍ້ມູນບໍລິສັດ
      text: ການປ່ຽນທີ່ຢູ່, ຜູ້ອຳນວຍການ, ຜູ້ຖືຫຸ້ນ, ທຶນ ຫຼື ກິດຈະການທຸລະກິດ.
    - title: ໃບອະນຸຍາດສະເພາະຂະແໜງ
      text: ໃບອະນຸຍາດນຳເຂົ້າ, ໃບອະນຸຍາດດຳເນີນງານ ແລະ ການອະນຸມັດອື່ນໆສະເພາະອຸດສາຫະກຳຂອງທ່ານ.
    - title: ການຢັ້ງຢືນ ແລະ ການຮັບຮອງເອກະສານ
      text: ສຳເນົາທີ່ມີການຢັ້ງຢືນ ແລະ ການຮັບຮອງເອກະສານທາງກົງສຸນ ເພື່ອໃຊ້ໃນລາວ ຫຼື ຕ່າງປະເທດ.
    - title: ປະສານງານກັບພາກລັດ
      text: ໄປພົບປະເຈົ້າໜ້າທີ່ພ້ອມທ່ານ ແລະ ຕິດຕາມເອກະສານກັບກະຊວງ ແລະ ຫ້ອງການແຂວງ.
  process:
    - title: ບອກພວກເຮົາວ່າທ່ານຕ້ອງການຫຍັງ
      text: ແຈ້ງເອກະສານ ຫຼື ໃບອະນຸຍາດທີ່ທ່ານຕ້ອງການ ແລະ ສະຖານະປັດຈຸບັນຂອງທ່ານ.
    - title: ລາຍການເອກະສານ ແລະ ໃບສະເໜີລາຄາ
      text: ພວກເຮົາສົ່ງລາຍການເອກະສານທີ່ຕ້ອງໃຊ້, ໄລຍະເວລາທີ່ຄາດໄວ້ ແລະ ຄ່າບໍລິການ.
    - title: ກະກຽມເອກະສານ
      text: ພວກເຮົາກອກແບບຟອມເປັນພາສາລາວ, ກວດທຸກເອກະສານ ແລະ ຈັດການແປ ຫຼື ການຢັ້ງຢືນ.
    - title: ຍື່ນ ແລະ ຕິດຕາມ
      text: ພວກເຮົາຍື່ນເອກະສານ ແລະ ຕິດຕາມກັບຫ້ອງການທີ່ຮັບຜິດຊອບ ຈົນກວ່າຈະໄດ້ຮັບການອະນຸມັດ.
    - title: ສົ່ງມອບ
      text: ທ່ານຈະໄດ້ຮັບເອກະສານສະບັບຕົ້ນ, ສຳເນົາ ແລະ ການແຈ້ງເຕືອນວັນຕໍ່ອາຍຸຄັ້ງຕໍ່ໄປ.
  documents:
    - ໃບທະບຽນວິສາຫະກິດ ແລະ ໃບອະນຸຍາດປັດຈຸບັນ
    - ສຳເນົາໜັງສືຜ່ານແດນ ແລະ ວີຊາ (ສຳລັບໃບອະນຸຍາດທີ່ກ່ຽວກັບຄົນຕ່າງປະເທດ)
    - ກາປະທັບບໍລິສັດ ແລະ ຂໍ້ມູນຜູ້ມີສິດລົງລາຍເຊັນ
    - ໃບມອບສິດໃຫ້ MVM GROUP ດຳເນີນການແທນ
    - ໜັງສື, ສັນຍາ ຫຼື ໃບຢັ້ງຢືນທີ່ກ່ຽວຂ້ອງກັບຄຳຮ້ອງ
    - ຮູບຖ່າຍຫຼ້າສຸດ (ສຳລັບໃບອະນຸຍາດສ່ວນບຸກຄົນ)
  timeline:
    - item: ກວດສອບເອກະສານ
      duration: 1–2 ວັນລັດຖະການ
    - item: ການຕໍ່ອາຍຸ ແລະ ການແກ້ໄຂທົ່ວໄປ
      duration: 1–3 ອາທິດ
    - item: ໃບອະນຸຍາດເຮັດວຽກ ແລະ ບັດພັກເຊົາ
      duration: 2–6 ອາທິດ
    - item: ໃບອະນຸຍາດໃໝ່ ແລະ ໃບອະນຸຍາດສະເພາະຂະແໜງ
      duration: ສະເໜີລາຄາຕາມແຕ່ລະກໍລະນີ
  faq:
    - question: ທ່ານສາມາດດຳເນີນເອກະສານຢູ່ແຂວງອື່ນ ນອກຈາກວຽງຈັນໄດ້ບໍ?
      answer: ໄດ້. ພວກເຮົາປະສານງານກັບຫ້ອງການແຂວງ ແລະ ວາງແຜນລົງພື້ນທີ່ເມື່ອຫ້ອງການຕ້ອງການ.
    - question: ເອກະສານຂອງຂ້ອຍເປັນພາສາຈີນ ຫຼື ອັງກິດ, ມີບັນຫາບໍ?
      answer: ບໍ່ມີ. ທີມແປພາສາຂອງພວກເຮົາຈະແປເປັນພາສາລາວ ແລະ ຈັດການການຢັ້ງຢືນ ຫຼື ການຮັບຮອງ ເມື່ອຫ້ອງການຕ້ອງການ.
    - question: ທ່ານຮັບປະກັນວ່າຈະໄດ້ຮັບການອະນຸມັດບໍ?
      answer: ການອະນຸມັດແມ່ນການຕັດສິນໃຈຂອງເຈົ້າໜ້າທີ່. ພວກເຮົາຮັບປະກັນວ່າເອກະສານຂອງທ່ານຄົບຖ້ວນ ແລະ ຖືກຕ້ອງ, ຕິດຕາມຢ່າງໃກ້ຊິດ ແລະ ແຈ້ງໃຫ້ທ່ານຮູ້ໄວ ຖ້າຂາດຫຍັງ.
    - question: ທ່ານສາມາດແຈ້ງເຕືອນເມື່ອໃບອະນຸຍາດໃກ້ໝົດອາຍຸໄດ້ບໍ?
      answer: ໄດ້. ພວກເຮົາມີປະຕິທິນການຕໍ່ອາຍຸສຳລັບລູກຄ້າປະຈຳ ແລະ ຈະຕິດຕໍ່ທ່ານກ່ອນກຳນົດເວລາ.
zh:
  title: 政府文件办理
  summary: 营业执照、许可证、商业文件办理及与老挝政府部门的协调。
  seo_title: 老挝政府文件、执照与许可证办理
  seo_description: MVM 集团在老挝办理营业执照及续期、工作许可与居留许可、公司变更、文件认证及政府事务对接。
  intro: |-
    在老挝办理政府文件，往往涉及多个部门、老挝语表格以及不断变化的要求。我们为您准备完整的材料、递交申请、与主管部门跟进，并随时通报进展，直至文件签发。

    客户委托我们办理新执照及续期、外籍员工的工作许可和居留许可、公司变更，以及日常经营所需的各类证明和函件。
  audience:
    - 在老挝经营的外资企业
    - 需要续期或变更执照的老挝企业
    - 聘用外籍员工来老挝工作的雇主
    - 申请行业审批的投资者
    - 需要准备或认证官方文件的个人
  help:
    - title: 营业执照及续期
      text: 企业登记信息更新、年度续期及执照变更。
    - title: 工作许可与居留许可
      text: 为外籍员工及其家属办理申请和续期。
    - title: 公司变更
      text: 变更地址、董事、股东、注册资本或经营范围。
    - title: 行业许可
      text: 进口许可证、经营许可证及您所在行业的其他专项审批。
    - title: 公证与认证
      text: 核证副本、文件公证，以及用于老挝或海外的领事认证。
    - title: 政府事务对接
      text: 陪同您与政府部门会面，并与各部委及省级部门跟进办理进度。
  process:
    - title: 告诉我们您的需求
      text: 说明您需要办理的文件或许可证以及目前的情况。
    - title: 文件清单与报价
      text: 我们发送所需文件清单、预计时间和服务费用。
    - title: 准备材料
      text: 我们用老挝语填写表格，逐一检查文件，并安排翻译或认证。
    - title: 递交与跟进
      text: 我们递交材料并与主管部门持续跟进，直至获批。
    - title: 交付
      text: 您将收到原件、副本以及下次续期日期提醒。
  documents:
    - 企业登记证及现有执照
    - 护照及签证复印件（涉及外籍人员的许可）
    - 公司印章及授权签字人信息
    - 授权 MVM 集团代为办理的委托书
    - 与申请相关的函件、合同或证明
    - 近期照片（个人许可证件）
  timeline:
    - item: 文件审核
      duration: 1–2 个工作日
    - item: 续期及简单变更
      duration: 1–3 周
    - item: 工作许可与居留许可
      duration: 2–6 周
    - item: 新执照及行业许可
      duration: 视具体情况报价
  faq:
    - question: 你们可以在万象以外的省份办理文件吗？
      answer: 可以。我们与各省级部门协调，必要时安排实地办理。
    - question: 我的文件是中文或英文的，有问题吗？
      answer: 没问题。我们的翻译团队会准备老挝语译本，并在部门要求时安排公证或认证。
    - question: 你们能保证获批吗？
      answer: 审批由主管部门决定。我们确保您的材料完整准确，密切跟进，如有缺漏会第一时间告知您。
    - question: 执照到期前可以提醒我们吗？
      answer: 可以。我们为长期客户建立续期日历，并在截止日期前联系您。
