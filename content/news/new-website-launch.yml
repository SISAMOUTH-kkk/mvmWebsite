en:
  title: MVM GROUP launches its new website in Lao, English and Chinese
  date: 2026-10-15
  category: company-news
  cover: ""
  featured: true
  author: MVM GROUP
  excerpt: One place to see our services, our business units and our brands, and to request a quote in your own language.
  seo_title: ""
  seo_description: ""
  body: |-
    MVM GROUP has launched a new website that brings the whole group together in one place, in Lao, English and Chinese.

    Visitors can now see how the group is organised, from business and government services to travel, trade and logistics, and our own consumer brands, and go straight to the service they need.

    ## What you can do on the site

    - **Explore six core services**, each with who it is for, how it works, the documents you need and typical timelines.
    - **Request a quote** for one or several services in a single form.
    - **Apply to become a distributor** for Big Elephant Yogurt and Pa Daek Sophanua, or contact us about investment and partnerships.
    - **Read news and guides** on investing, documentation, logistics and travel in Laos.

    ## Built to grow with the group

    New services, brands, projects and business units can be added as MVM GROUP grows, so the site will expand together with the group.

    If you have questions or feedback, [contact us](/en/contact/). We reply in Lao, Chinese, Thai or English.
la:
  title: MVM GROUP ເປີດຕົວເວັບໄຊໃໝ່ ເປັນພາສາລາວ, ອັງກິດ ແລະ ຈີນ
  author: MVM GROUP
  excerpt: ບ່ອນດຽວທີ່ທ່ານຈະເຫັນບໍລິການ, ໜ່ວຍທຸລະກິດ ແລະ ແບຣນຂອງພວກເຮົາ ແລະ ຂໍໃບສະເໜີລາຄາເປັນພາສາຂອງທ່ານເອງ.
  body: |-
    MVM GROUP ໄດ້ເປີດຕົວເວັບໄຊໃໝ່ ທີ່ລວມທຸກໜ່ວຍງານຂອງກຸ່ມໄວ້ໃນບ່ອນດຽວ ເປັນພາສາລາວ, ອັງກິດ ແລະ ຈີນ.

    ຜູ້ເຂົ້າຊົມສາມາດເບິ່ງໂຄງສ້າງຂອງກຸ່ມບໍລິສັດ ຕັ້ງແຕ່ບໍລິການທຸລະກິດ ແລະ ເອກະສານທາງລັດ ຈົນເຖິງການທ່ອງທ່ຽວ, ການຄ້າ ແລະ ໂລຈິສຕິກ ແລະ ແບຣນສິນຄ້າຂອງພວກເຮົາເອງ ແລະ ໄປຫາບໍລິການທີ່ຕ້ອງການໄດ້ທັນທີ.

    ## ສິ່ງທີ່ທ່ານເຮັດໄດ້ໃນເວັບໄຊ

    - **ສຳຫຼວດບໍລິການຫຼັກ 6 ດ້ານ** ແຕ່ລະບໍລິການມີຂໍ້ມູນວ່າເໝາະກັບໃຜ, ຂັ້ນຕອນ, ເອກະສານທີ່ຕ້ອງໃຊ້ ແລະ ໄລຍະເວລາໂດຍທົ່ວໄປ.
    - **ຂໍໃບສະເໜີລາຄາ** ສຳລັບໜຶ່ງ ຫຼື ຫຼາຍບໍລິການໃນແບບຟອມດຽວ.
    - **ສະໝັກເປັນຕົວແທນຈຳໜ່າຍ** ໂຢເກີດທ໌ ຊ້າງໃຫຍ່ ແລະ ປາແດກໂສພານົວ ຫຼື ຕິດຕໍ່ພວກເຮົາເລື່ອງການລົງທຶນ ແລະ ການຮ່ວມມື.
    - **ອ່ານຂ່າວ ແລະ ຄູ່ມື** ກ່ຽວກັບການລົງທຶນ, ເອກະສານ, ໂລຈິສຕິກ ແລະ ການທ່ອງທ່ຽວໃນລາວ.

    ## ສ້າງມາເພື່ອເຕີບໂຕໄປພ້ອມກັບກຸ່ມ

    ບໍລິການ, ແບຣນ, ຜົນງານ ແລະ ໜ່ວຍທຸລະກິດໃໝ່ ສາມາດເພີ່ມເຂົ້າໄດ້ຕາມການເຕີບໂຕຂອງ MVM GROUP ເພື່ອໃຫ້ເວັບໄຊຂະຫຍາຍໄປພ້ອມກັບກຸ່ມບໍລິສັດ.

    ຖ້າມີຄຳຖາມ ຫຼື ຄຳຄິດເຫັນ, [ຕິດຕໍ່ພວກເຮົາ](/la/contact/). ພວກເຮົາຕອບເປັນພາສາລາວ, ຈີນ, ໄທ ຫຼື ອັງກິດ.
zh:
  title: MVM 集团老挝语、英语、中文新网站正式上线
  author: MVM 集团
  excerpt: 在一个网站上了解我们的服务、业务板块和品牌，并用您的语言获取报价。
  body: |-
    MVM 集团正式上线全新网站，以老挝语、英语和中文三种语言，将集团的全部业务集中展示。

    访客可以清楚了解集团的组织架构，从商务与政府事务服务，到旅游、贸易与物流，以及我们的自有消费品牌，并直接找到所需服务。

    ## 您可以在网站上

    - **了解六大核心服务**，每项服务均介绍适用对象、办理流程、所需文件和一般周期。
    - **获取报价**，在一张表单中咨询一项或多项服务。
    - **申请成为经销商**，代理大象酸奶和索法努阿鱼酱，或就投资与合作与我们联系。
    - **阅读新闻和指南**，了解在老挝投资、办理文件、物流和旅游的相关信息。

    ## 与集团共同成长

    随着 MVM 集团的发展，新的服务、品牌、案例和业务板块都可以随时添加，网站将与集团一同成长。

    如有任何问题或建议，欢迎[联系我们](/zh/contact/)。我们可使用老挝语、中文、泰语或英语回复。
