en:
  title: "Preparing foreign documents for use in Laos: a checklist"
  date: 2026-08-20
  category: government-documents
  cover: ""
  featured: false
  author: MVM GROUP
  excerpt: Company papers, diplomas and certificates issued abroad usually need translation and certification before a Lao office accepts them.
  seo_title: ""
  seo_description: ""
  body: |-
    Many applications in Laos, from company registration to work permits, rely on documents issued in another country. Preparing them correctly the first time avoids weeks of back-and-forth.

    ## Before you start

    - **Ask which documents the office needs.** Requirements differ by office and by application.
    - **Check that names match.** The spelling of names and company names should be the same across passports, certificates and forms.
    - **Use recent documents.** Some offices only accept certificates issued within a recent period.

    ## Certification and legalisation

    Documents issued abroad often need to be certified in the country where they were issued and then legalised for use in Laos. The exact steps depend on the country of issue and the receiving office, so confirm them before you send anything.

    ## Translation

    Documents not in Lao usually need a Lao translation laid out to match the original. Keep the translation and the original together in the same order.

    ## Keep copies

    Scan every page, including stamps and the back of certificates, and keep a set of certified copies for future applications and renewals.

    ---

    Our [documentation](/en/services/government-documentation/) and [translation](/en/services/translation-interpretation/) teams can check your documents and prepare them for submission.
la:
  title: "ການກະກຽມເອກະສານຈາກຕ່າງປະເທດ ເພື່ອໃຊ້ໃນລາວ: ລາຍການກວດສອບ"
  author: MVM GROUP
  excerpt: ເອກະສານບໍລິສັດ, ໃບປະກາດ ແລະ ໃບຢັ້ງຢືນທີ່ອອກຢູ່ຕ່າງປະເທດ ມັກຕ້ອງແປ ແລະ ຢັ້ງຢືນ ກ່ອນຫ້ອງການລາວຈະຮັບ.
  body: |-
    ຫຼາຍຄຳຮ້ອງໃນລາວ ຕັ້ງແຕ່ການຈົດທະບຽນບໍລິສັດ ຈົນເຖິງໃບອະນຸຍາດເຮັດວຽກ ຕ້ອງໃຊ້ເອກະສານທີ່ອອກຢູ່ປະເທດອື່ນ. ການກະກຽມໃຫ້ຖືກຕ້ອງຕັ້ງແຕ່ຄັ້ງທຳອິດ ຊ່ວຍຫຼີກລ່ຽງການແກ້ໄຂໄປມາຫຼາຍອາທິດ.

    ## ກ່ອນເລີ່ມຕົ້ນ

    - **ສອບຖາມວ່າຫ້ອງການຕ້ອງການເອກະສານຫຍັງແດ່.** ເງື່ອນໄຂແຕກຕ່າງກັນໄປຕາມຫ້ອງການ ແລະ ປະເພດຄຳຮ້ອງ.
    - **ກວດວ່າຊື່ກົງກັນ.** ການສະກົດຊື່ບຸກຄົນ ແລະ ຊື່ບໍລິສັດ ຄວນຄືກັນໃນໜັງສືຜ່ານແດນ, ໃບຢັ້ງຢືນ ແລະ ແບບຟອມ.
    - **ໃຊ້ເອກະສານທີ່ອອກໃໝ່.** ບາງຫ້ອງການຮັບສະເພາະໃບຢັ້ງຢືນທີ່ອອກໃນໄລຍະບໍ່ດົນມານີ້.

    ## ການຢັ້ງຢືນ ແລະ ການຮັບຮອງ

    ເອກະສານທີ່ອອກຢູ່ຕ່າງປະເທດ ມັກຕ້ອງໄດ້ຮັບການຢັ້ງຢືນໃນປະເທດທີ່ອອກເອກະສານ ແລ້ວຈຶ່ງຮັບຮອງເພື່ອໃຊ້ໃນລາວ. ຂັ້ນຕອນທີ່ແນ່ນອນຂຶ້ນກັບປະເທດທີ່ອອກ ແລະ ຫ້ອງການທີ່ຮັບເອກະສານ, ສະນັ້ນ ກະລຸນາຢືນຢັນກ່ອນສົ່ງ.

    ## ການແປ

    ເອກະສານທີ່ບໍ່ແມ່ນພາສາລາວ ມັກຕ້ອງມີຄຳແປພາສາລາວ ທີ່ຈັດຮູບແບບໃຫ້ກົງກັບຕົ້ນສະບັບ. ເກັບຄຳແປ ແລະ ຕົ້ນສະບັບໄວ້ນຳກັນຕາມລຳດັບດຽວກັນ.

    ## ເກັບສຳເນົາໄວ້

    ສະແກນທຸກໜ້າ ລວມທັງກາປະທັບ ແລະ ດ້ານຫຼັງຂອງໃບຢັ້ງຢືນ ແລະ ເກັບສຳເນົາທີ່ຢັ້ງຢືນແລ້ວໄວ້ ສຳລັບຄຳຮ້ອງ ແລະ ການຕໍ່ອາຍຸໃນອະນາຄົດ.

    ---

    ທີມ[ເອກະສານ](/la/services/government-documentation/) ແລະ [ແປພາສາ](/la/services/translation-interpretation/) ຂອງພວກເຮົາ ສາມາດກວດ ແລະ ກະກຽມເອກະສານຂອງທ່ານເພື່ອຍື່ນໄດ້.
zh:
  title: 在老挝使用海外文件：准备清单
  author: MVM 集团
  excerpt: 在国外签发的公司文件、学历和证书，通常需要翻译和认证后才会被老挝部门接受。
  body: |-
    在老挝办理许多申请，从公司注册到工作许可，都需要使用其他国家签发的文件。第一次就准备正确，可以避免数周的反复修改。

    ## 开始之前

    - **先确认部门需要哪些文件。** 不同部门、不同申请的要求各不相同。
    - **核对姓名是否一致。** 护照、证书和表格上的个人姓名及公司名称拼写应保持一致。
    - **使用近期签发的文件。** 部分部门只接受近期签发的证明。

    ## 公证与认证

    在国外签发的文件，通常需要先在签发国办理公证，再办理用于老挝的认证。具体步骤取决于签发国和接收部门，请在寄送前确认。

    ## 翻译

    非老挝语文件通常需要按原件格式排版的老挝语译文。请将译文与原件按相同顺序放在一起。

    ## 保留副本

    扫描每一页，包括印章和证书背面，并保留一套核证副本，以备今后申请和续期使用。

    ---

    我们的[文件办理](/zh/services/government-documentation/)和[翻译](/zh/services/translation-interpretation/)团队可以帮您检查文件并准备递交。
