en:
  title: Luang Prabang Heritage
  summary: >-
    The UNESCO World Heritage town of golden temples, the morning alms giving, Kuang Si Falls and a boat trip on the
    Mekong.
  service: tour-travel
  order: 3
  duration: 3 days · 2 nights
  route: Vientiane → Luang Prabang
  image: /img/photos/laos-wat-mai-card.jpg
  hero_image: /img/photos/laos-phou-si-wide.jpg
  photo_credit: >-
    Photos: [Basile Morin](https://commons.wikimedia.org/wiki/User:Basile_Morin), Wikimedia Commons,
    [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/)
  best_for: Culture lovers, couples, families and photographers
  start: Vientiane
  end: Luang Prabang (airport or station)
  transport: Laos–China Railway, private van and Mekong boat
  overview: >-
    Luang Prabang, where the Mekong meets the Nam Khan, is a UNESCO World Heritage town of golden temples and old
    colonial houses. Three days give you time for the old town, the morning alms giving, the turquoise pools of Kuang
    Si Falls and a boat trip on the Mekong.
  highlights:
    - Fast train from Vientiane in about 2 hours
    - Wat Xieng Thong and the Royal Palace Museum
    - Sunset from the top of Mount Phousi
    - The morning alms giving (Tak Bat)
    - Kuang Si Falls and a Mekong sunset cruise
    - The Pak Ou Caves by boat
  days:
    - title: Train to Luang Prabang and the old town
      visits:
        - Morning train from Vientiane to Luang Prabang (about 2 hours)
        - Wat Xieng Thong, the jewel of Luang Prabang's temples
        - The Royal Palace Museum (Haw Kham) and Wat Mai
        - Climb Mount Phousi for the sunset
        - Evening at the night market
      overnight: Boutique hotel in the old town
      transport: Laos–China Railway, then private van
    - title: Alms giving, Kuang Si Falls and a Mekong cruise
      visits:
        - "At dawn: watch the monks' alms giving (Tak Bat) quietly and respectfully"
        - "Kuang Si Falls: turquoise pools and the bear rescue centre"
        - Afternoon at leisure in the old town
        - Sunset cruise on the Mekong
      overnight: Boutique hotel in the old town
      transport: Private van and boat
    - title: The Pak Ou Caves and departure
      visits:
        - Morning boat trip up the Mekong to the Pak Ou Caves, filled with Buddha images
        - Back to Luang Prabang for lunch
        - Transfer to the airport or the station
      overnight: Onward journey
      transport: Mekong boat and private van; flight or train to Vientiane
  includes:
    - Train ticket Vientiane–Luang Prabang (second class)
    - Private van with driver in Luang Prabang
    - Guide speaking Lao, English, Chinese or Thai
    - 2 nights in a hotel with breakfast
    - Mekong boat trips (Pak Ou Caves and sunset cruise)
    - Entrance fees for the sights listed
    - Drinking water
  excludes:
    - Flights, or the train back to Vientiane
    - Lunch and dinner
    - Personal expenses and tips
la:
  title: ທົວຫຼວງພະບາງ ມໍລະດົກໂລກ
  summary: >-
    ເມືອງມໍລະດົກໂລກຂອງ UNESCO ທີ່ເຕັມໄປດ້ວຍວັດວາອາຮາມ, ການຕັກບາດຕອນເຊົ້າ, ນ້ຳຕົກຕາດກວາງຊີ ແລະ ລ່ອງເຮືອແມ່ນ້ຳຂອງ.
  duration: 3 ມື້ 2 ຄືນ
  route: ວຽງຈັນ → ຫຼວງພະບາງ
  photo_credit: >-
    ພາບ: [Basile Morin](https://commons.wikimedia.org/wiki/User:Basile_Morin), Wikimedia Commons,
    [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/)
  best_for: ຜູ້ຮັກວັດທະນະທຳ, ຄູ່ຮັກ, ຄອບຄົວ ແລະ ຊ່າງພາບ
  start: ວຽງຈັນ
  end: ຫຼວງພະບາງ (ສະໜາມບິນ ຫຼື ສະຖານີລົດໄຟ)
  transport: ລົດໄຟລາວ-ຈີນ, ລົດຕູ້ສ່ວນຕົວ ແລະ ເຮືອແມ່ນ້ຳຂອງ
  overview: >-
    ຫຼວງພະບາງ ບ່ອນທີ່ແມ່ນ້ຳຂອງບັນຈົບກັບນ້ຳຄານ ເປັນເມືອງມໍລະດົກໂລກທີ່ມີວັດວາອາຮາມ ແລະ ເຮືອນແບບອານານິຄົມເກົ່າ.
    3 ມື້ ພຽງພໍສຳລັບທ່ຽວຕົວເມືອງເກົ່າ, ຊົມການຕັກບາດຕອນເຊົ້າ, ລອຍນ້ຳຕາດກວາງຊີ ແລະ ລ່ອງເຮືອແມ່ນ້ຳຂອງ.
  highlights:
    - ລົດໄຟຄວາມໄວສູງຈາກວຽງຈັນ ປະມານ 2 ຊົ່ວໂມງ
    - ວັດຊຽງທອງ ແລະ ພິພິທະພັນພະລາຊະວັງ
    - ຊົມຕາເວັນຕົກເທິງຍອດພູສີ
    - ການຕັກບາດຕອນເຊົ້າ
    - ນ້ຳຕົກຕາດກວາງຊີ ແລະ ລ່ອງເຮືອຊົມຕາເວັນຕົກແມ່ນ້ຳຂອງ
    - ນັ່ງເຮືອໄປຖ້ຳຕິ່ງ (ປາກອູ)
  days:
    - title: ຂີ່ລົດໄຟໄປຫຼວງພະບາງ ແລະ ທ່ຽວຕົວເມືອງເກົ່າ
      visits:
        - ຂີ່ລົດໄຟຕອນເຊົ້າຈາກວຽງຈັນໄປຫຼວງພະບາງ (ປະມານ 2 ຊົ່ວໂມງ)
        - ວັດຊຽງທອງ ວັດທີ່ງາມທີ່ສຸດຂອງຫຼວງພະບາງ
        - ພິພິທະພັນພະລາຊະວັງ (ຫໍຄຳ) ແລະ ວັດໃໝ່
        - ຂຶ້ນພູສີຊົມຕາເວັນຕົກ
        - ຍ່າງຕະຫຼາດກາງຄືນ
      overnight: ໂຮງແຮມບູຕິກໃນຕົວເມືອງເກົ່າ
      transport: ລົດໄຟລາວ-ຈີນ ຕໍ່ດ້ວຍລົດຕູ້ສ່ວນຕົວ
    - title: ຕັກບາດ, ຕາດກວາງຊີ ແລະ ລ່ອງເຮືອແມ່ນ້ຳຂອງ
      visits:
        - "ຕອນເຊົ້າມືດ: ຊົມການຕັກບາດຂອງພະສົງ ຢ່າງງຽບໆ ແລະ ສຸພາບ"
        - "ນ້ຳຕົກຕາດກວາງຊີ: ອ່າງນ້ຳສີຟ້າ ແລະ ສູນອະນຸລັກໝີ"
        - ຕອນບ່າຍ ພັກຜ່ອນຕາມອັດທະຍາໄສໃນຕົວເມືອງ
        - ລ່ອງເຮືອຊົມຕາເວັນຕົກແມ່ນ້ຳຂອງ
      overnight: ໂຮງແຮມບູຕິກໃນຕົວເມືອງເກົ່າ
      transport: ລົດຕູ້ສ່ວນຕົວ ແລະ ເຮືອ
    - title: ຖ້ຳຕິ່ງ ແລະ ເດີນທາງກັບ
      visits:
        - ນັ່ງເຮືອຕອນເຊົ້າຂຶ້ນແມ່ນ້ຳຂອງໄປຖ້ຳຕິ່ງ (ປາກອູ) ທີ່ມີພະພຸດທະຮູບຫຼາຍພັນອົງ
        - ກັບຫຼວງພະບາງ ກິນອາຫານທ່ຽງ
        - ສົ່ງສະໜາມບິນ ຫຼື ສະຖານີລົດໄຟ
      overnight: ເດີນທາງຕໍ່
      transport: ເຮືອ ແລະ ລົດຕູ້ສ່ວນຕົວ; ຍົນ ຫຼື ລົດໄຟກັບວຽງຈັນ
  includes:
    - ປີ້ລົດໄຟ ວຽງຈັນ-ຫຼວງພະບາງ (ຊັ້ນ 2)
    - ລົດຕູ້ສ່ວນຕົວພ້ອມຄົນຂັບໃນຫຼວງພະບາງ
    - ໄກດ໌ພາສາລາວ, ອັງກິດ, ຈີນ ຫຼື ໄທ
    - ໂຮງແຮມ 2 ຄືນ ພ້ອມອາຫານເຊົ້າ
    - ເຮືອລ່ອງແມ່ນ້ຳຂອງ (ຖ້ຳຕິ່ງ ແລະ ຕາເວັນຕົກ)
    - ຄ່າເຂົ້າຊົມສະຖານທີ່ຕາມໂປຣແກຣມ
    - ນ້ຳດື່ມ
  excludes:
    - ປີ້ຍົນ ຫຼື ປີ້ລົດໄຟຂາກັບວຽງຈັນ
    - ອາຫານທ່ຽງ ແລະ ອາຫານແລງ
    - ຄ່າໃຊ້ຈ່າຍສ່ວນຕົວ ແລະ ທິບ
zh:
  title: 琅勃拉邦世界遗产之旅
  summary: 联合国教科文组织世界遗产古城：金色寺庙、清晨布施、光西瀑布和湄公河游船。
  duration: 3天2晚
  route: 万象 → 琅勃拉邦
  photo_credit: >-
    图片：[Basile Morin](https://commons.wikimedia.org/wiki/User:Basile_Morin)，Wikimedia Commons，
    [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/)
  best_for: 文化爱好者、情侣、家庭及摄影爱好者
  start: 万象
  end: 琅勃拉邦（机场或火车站）
  transport: 中老铁路、私人商务车及湄公河游船
  overview: >-
    琅勃拉邦位于湄公河与南康河交汇处，是一座拥有金色寺庙和老式殖民建筑的世界遗产古城。三天时间足以游览古城、观看清晨布施、在光西瀑布的蓝绿色水潭边漫步，并乘船游览湄公河。
  highlights:
    - 从万象乘动车约2小时到达
    - 香通寺与皇宫博物馆
    - 普西山顶看日落
    - 清晨布施（Tak Bat）
    - 光西瀑布与湄公河日落游船
    - 乘船前往帕乌洞
  days:
    - title: 乘火车前往琅勃拉邦，游览古城
      visits:
        - 上午乘火车从万象前往琅勃拉邦（约2小时）
        - 香通寺，琅勃拉邦最精美的寺庙
        - 皇宫博物馆（Haw Kham）与迈寺
        - 登普西山看日落
        - 晚上逛夜市
      overnight: 古城精品酒店
      transport: 中老铁路，转乘私人商务车
    - title: 清晨布施、光西瀑布与湄公河游船
      visits:
        - 黎明：安静、尊重地观看僧侣布施
        - 光西瀑布：蓝绿色水潭与黑熊救助中心
        - 下午古城自由活动
        - 湄公河日落游船
      overnight: 古城精品酒店
      transport: 私人商务车及游船
    - title: 帕乌洞与返程
      visits:
        - 上午乘船沿湄公河而上，前往供奉数千尊佛像的帕乌洞
        - 返回琅勃拉邦午餐
        - 送往机场或火车站
      overnight: 继续行程
      transport: 游船及私人商务车；乘飞机或火车返回万象
  includes:
    - 万象—琅勃拉邦火车票（二等座）
    - 琅勃拉邦当地带司机私人商务车
    - 老挝语、英语、中文或泰语导游
    - 2晚酒店含早餐
    - 湄公河游船（帕乌洞及日落游船）
    - 行程所列景点门票
    - 饮用水
  excludes:
    - 机票或返回万象的火车票
    - 午餐及晚餐
    - 个人消费及小费
