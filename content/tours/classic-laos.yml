en:
  title: "Classic Laos: Vientiane, Vang Vieng & Luang Prabang"
  summary: >-
    The capital, the mountains and the heritage town in one trip, linked by the fast train. The best first trip to
    Laos.
  service: tour-travel
  order: 4
  duration: 5 days · 4 nights
  route: Vientiane → Vang Vieng → Luang Prabang
  image: /img/photos/laos-kuang-si-card.jpg
  hero_image: /img/photos/laos-mekong-wide.jpg
  photo_credit: >-
    Photos: [Basile Morin](https://commons.wikimedia.org/wiki/User:Basile_Morin), Wikimedia Commons,
    [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/)
  best_for: First trip to Laos, families and small groups
  start: Vientiane
  end: Luang Prabang
  transport: Laos–China Railway, private van and Mekong boat
  overview: >-
    The best of Laos in five days. Start in the capital, spend a night among the karst mountains of Vang Vieng, then
    continue by train to Luang Prabang for temples, waterfalls and the Mekong. Every long journey is by fast train, so
    you spend your time sightseeing, not on the road.
  highlights:
    - Pha That Luang and Patuxai in Vientiane
    - The Blue Lagoon and kayaking in Vang Vieng
    - Sunset on Mount Phousi and the morning alms giving in Luang Prabang
    - The turquoise pools of Kuang Si Falls
    - Every long journey by fast train
  days:
    - title: Arrival and Vientiane city tour
      visits:
        - Pick-up at the airport, station or your hotel
        - Pha That Luang and Patuxai
        - Wat Si Saket
        - Sunset and the night market on the Mekong riverside
      overnight: Hotel in central Vientiane
      transport: Private van
    - title: Train to Vang Vieng
      visits:
        - Train from Vientiane to Vang Vieng (about 1 hour)
        - The Blue Lagoon and Tham Phu Kham cave
        - Kayaking on the Nam Song river
        - Sunset over the mountains
      overnight: Riverside hotel in Vang Vieng
      transport: Laos–China Railway and private van
    - title: Vang Vieng to Luang Prabang
      visits:
        - "Optional: sunrise hot-air balloon flight"
        - Train from Vang Vieng to Luang Prabang (about 1 hour)
        - Wat Xieng Thong and the old town
        - Sunset on Mount Phousi and the night market
      overnight: Boutique hotel in Luang Prabang's old town
      transport: Private van and Laos–China Railway
    - title: Alms giving and Kuang Si Falls
      visits:
        - "At dawn: the monks' alms giving"
        - Kuang Si Falls and the bear rescue centre
        - The Royal Palace Museum
        - Sunset cruise on the Mekong
      overnight: Boutique hotel in Luang Prabang's old town
      transport: Private van and boat
    - title: Pak Ou Caves and departure
      visits:
        - "Morning: boat trip to the Pak Ou Caves, or free time"
        - Transfer to Luang Prabang airport, or the train back to Vientiane
      overnight: Onward journey
      transport: Boat and private van; flight or train
  includes:
    - All train tickets in the itinerary (second class)
    - Private van with driver
    - Guide speaking Lao, English, Chinese or Thai
    - 4 nights in hotels with breakfast
    - Kayaking and Mekong boat trips
    - Entrance fees for the sights listed
    - Drinking water
  excludes:
    - International flights and visa fees
    - Hot-air balloon flight (optional)
    - Lunch and dinner
    - Personal expenses and tips
la:
  title: "ທົວລາວຄລາສສິກ: ວຽງຈັນ, ວັງວຽງ ແລະ ຫຼວງພະບາງ"
  summary: >-
    ນະຄອນຫຼວງ, ພູຜາ ແລະ ເມືອງມໍລະດົກໂລກ ໃນທົວດຽວ ເຊື່ອມຕໍ່ດ້ວຍລົດໄຟຄວາມໄວສູງ. ເໝາະທີ່ສຸດສຳລັບການມາລາວຄັ້ງທຳອິດ.
  duration: 5 ມື້ 4 ຄືນ
  route: ວຽງຈັນ → ວັງວຽງ → ຫຼວງພະບາງ
  photo_credit: >-
    ພາບ: [Basile Morin](https://commons.wikimedia.org/wiki/User:Basile_Morin), Wikimedia Commons,
    [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/)
  best_for: ຜູ້ມາລາວຄັ້ງທຳອິດ, ຄອບຄົວ ແລະ ກຸ່ມນ້ອຍ
  start: ວຽງຈັນ
  end: ຫຼວງພະບາງ
  transport: ລົດໄຟລາວ-ຈີນ, ລົດຕູ້ສ່ວນຕົວ ແລະ ເຮືອແມ່ນ້ຳຂອງ
  overview: >-
    ສິ່ງທີ່ດີທີ່ສຸດຂອງລາວໃນ 5 ມື້. ເລີ່ມທີ່ນະຄອນຫຼວງ, ພັກ 1 ຄືນທ່າມກາງພູຫີນປູນວັງວຽງ ແລ້ວຂີ່ລົດໄຟຕໍ່ໄປຫຼວງພະບາງ
    ເພື່ອຊົມວັດວາອາຮາມ, ນ້ຳຕົກ ແລະ ແມ່ນ້ຳຂອງ. ການເດີນທາງໄກທຸກຊ່ວງແມ່ນໃຊ້ລົດໄຟຄວາມໄວສູງ ທ່ານຈຶ່ງມີເວລາທ່ຽວຫຼາຍຂຶ້ນ.
  highlights:
    - ພະທາດຫຼວງ ແລະ ປະຕູໄຊ ໃນວຽງຈັນ
    - ບຶງນ້ຳສີຟ້າ ແລະ ພາຍເຮືອຄາຢັກໃນວັງວຽງ
    - ຕາເວັນຕົກເທິງພູສີ ແລະ ການຕັກບາດຕອນເຊົ້າໃນຫຼວງພະບາງ
    - ອ່າງນ້ຳສີຟ້າຂອງຕາດກວາງຊີ
    - ເດີນທາງໄກທຸກຊ່ວງດ້ວຍລົດໄຟຄວາມໄວສູງ
  days:
    - title: ເດີນທາງມາຮອດ ແລະ ທ່ຽວນະຄອນຫຼວງວຽງຈັນ
      visits:
        - ຮັບທີ່ສະໜາມບິນ, ສະຖານີລົດໄຟ ຫຼື ໂຮງແຮມ
        - ພະທາດຫຼວງ ແລະ ປະຕູໄຊ
        - ວັດສີສະເກດ
        - ຊົມຕາເວັນຕົກ ແລະ ຕະຫຼາດກາງຄືນແຄມຂອງ
      overnight: ໂຮງແຮມໃຈກາງເມືອງວຽງຈັນ
      transport: ລົດຕູ້ສ່ວນຕົວ
    - title: ຂີ່ລົດໄຟໄປວັງວຽງ
      visits:
        - ລົດໄຟຈາກວຽງຈັນໄປວັງວຽງ (ປະມານ 1 ຊົ່ວໂມງ)
        - ບຶງນ້ຳສີຟ້າ ແລະ ຖ້ຳພູຄຳ
        - ພາຍເຮືອຄາຢັກຕາມລຳນ້ຳຊອງ
        - ຊົມຕາເວັນຕົກຫຼັງພູ
      overnight: ໂຮງແຮມແຄມນ້ຳຊອງ ວັງວຽງ
      transport: ລົດໄຟລາວ-ຈີນ ແລະ ລົດຕູ້ສ່ວນຕົວ
    - title: ວັງວຽງ ໄປ ຫຼວງພະບາງ
      visits:
        - "ທາງເລືອກ: ຂີ່ບານລູນລົມຮ້ອນຊົມຕາເວັນຂຶ້ນ"
        - ລົດໄຟຈາກວັງວຽງໄປຫຼວງພະບາງ (ປະມານ 1 ຊົ່ວໂມງ)
        - ວັດຊຽງທອງ ແລະ ຕົວເມືອງເກົ່າ
        - ຕາເວັນຕົກເທິງພູສີ ແລະ ຕະຫຼາດກາງຄືນ
      overnight: ໂຮງແຮມບູຕິກໃນຕົວເມືອງເກົ່າຫຼວງພະບາງ
      transport: ລົດຕູ້ສ່ວນຕົວ ແລະ ລົດໄຟລາວ-ຈີນ
    - title: ຕັກບາດ ແລະ ຕາດກວາງຊີ
      visits:
        - "ຕອນເຊົ້າມືດ: ຊົມການຕັກບາດຂອງພະສົງ"
        - ນ້ຳຕົກຕາດກວາງຊີ ແລະ ສູນອະນຸລັກໝີ
        - ພິພິທະພັນພະລາຊະວັງ
        - ລ່ອງເຮືອຊົມຕາເວັນຕົກແມ່ນ້ຳຂອງ
      overnight: ໂຮງແຮມບູຕິກໃນຕົວເມືອງເກົ່າຫຼວງພະບາງ
      transport: ລົດຕູ້ສ່ວນຕົວ ແລະ ເຮືອ
    - title: ຖ້ຳຕິ່ງ ແລະ ເດີນທາງກັບ
      visits:
        - "ຕອນເຊົ້າ: ນັ່ງເຮືອໄປຖ້ຳຕິ່ງ ຫຼື ພັກຜ່ອນຕາມອັດທະຍາໄສ"
        - ສົ່ງສະໜາມບິນຫຼວງພະບາງ ຫຼື ຂີ່ລົດໄຟກັບວຽງຈັນ
      overnight: ເດີນທາງຕໍ່
      transport: ເຮືອ ແລະ ລົດຕູ້ສ່ວນຕົວ; ຍົນ ຫຼື ລົດໄຟ
  includes:
    - ປີ້ລົດໄຟທຸກຊ່ວງຕາມໂປຣແກຣມ (ຊັ້ນ 2)
    - ລົດຕູ້ສ່ວນຕົວພ້ອມຄົນຂັບ
    - ໄກດ໌ພາສາລາວ, ອັງກິດ, ຈີນ ຫຼື ໄທ
    - ໂຮງແຮມ 4 ຄືນ ພ້ອມອາຫານເຊົ້າ
    - ພາຍເຮືອຄາຢັກ ແລະ ເຮືອລ່ອງແມ່ນ້ຳຂອງ
    - ຄ່າເຂົ້າຊົມສະຖານທີ່ຕາມໂປຣແກຣມ
    - ນ້ຳດື່ມ
  excludes:
    - ປີ້ຍົນລະຫວ່າງປະເທດ ແລະ ຄ່າວີຊາ
    - ຄ່າຂີ່ບານລູນລົມຮ້ອນ (ທາງເລືອກ)
    - ອາຫານທ່ຽງ ແລະ ອາຫານແລງ
    - ຄ່າໃຊ້ຈ່າຍສ່ວນຕົວ ແລະ ທິບ
zh:
  title: 经典老挝：万象、万荣与琅勃拉邦
  summary: 首都、山水与世界遗产古城一次游遍，全程以动车相连，是首次来老挝的最佳选择。
  duration: 5天4晚
  route: 万象 → 万荣 → 琅勃拉邦
  photo_credit: >-
    图片：[Basile Morin](https://commons.wikimedia.org/wiki/User:Basile_Morin)，Wikimedia Commons，
    [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/)
  best_for: 首次来老挝的游客、家庭及小团
  start: 万象
  end: 琅勃拉邦
  transport: 中老铁路、私人商务车及湄公河游船
  overview: >-
    五天游遍老挝精华。从首都出发，在万荣的喀斯特群山间住一晚，再乘火车前往琅勃拉邦，游览寺庙、瀑布和湄公河。长途路段全部乘坐动车，把时间留给观光，而不是赶路。
  highlights:
    - 万象的塔銮与凯旋门
    - 万荣的蓝色泻湖与皮划艇
    - 琅勃拉邦普西山日落与清晨布施
    - 光西瀑布的蓝绿色水潭
    - 长途路段全程动车
  days:
    - title: 抵达，万象市区游
      visits:
        - 机场、火车站或酒店接人
        - 塔銮与凯旋门
        - 西沙格寺
        - 湄公河畔日落与夜市
      overnight: 万象市中心酒店
      transport: 私人商务车
    - title: 乘火车前往万荣
      visits:
        - 从万象乘火车前往万荣（约1小时）
        - 蓝色泻湖与普坎洞
        - 南松河皮划艇
        - 欣赏群山日落
      overnight: 万荣南松河畔酒店
      transport: 中老铁路及私人商务车
    - title: 万荣前往琅勃拉邦
      visits:
        - 可选：乘热气球看日出
        - 从万荣乘火车前往琅勃拉邦（约1小时）
        - 香通寺与古城
        - 普西山日落与夜市
      overnight: 琅勃拉邦古城精品酒店
      transport: 私人商务车及中老铁路
    - title: 清晨布施与光西瀑布
      visits:
        - 黎明：观看僧侣布施
        - 光西瀑布与黑熊救助中心
        - 皇宫博物馆
        - 湄公河日落游船
      overnight: 琅勃拉邦古城精品酒店
      transport: 私人商务车及游船
    - title: 帕乌洞与返程
      visits:
        - 上午：乘船前往帕乌洞，或自由活动
        - 送往琅勃拉邦机场，或乘火车返回万象
      overnight: 继续行程
      transport: 游船及私人商务车；飞机或火车
  includes:
    - 行程内全部火车票（二等座）
    - 带司机私人商务车
    - 老挝语、英语、中文或泰语导游
    - 4晚酒店含早餐
    - 皮划艇及湄公河游船
    - 行程所列景点门票
    - 饮用水
  excludes:
    - 国际机票及签证费
    - 热气球（自选项目）
    - 午餐及晚餐
    - 个人消费及小费
