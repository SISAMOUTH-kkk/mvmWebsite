la:
  title: ຂົນສົ່ງອຸປະກອນຈາກຈີນ ທາງລົດໄຟ ແລະ ທາງບົກ
  summary: ວາງແຜນເສັ້ນທາງ, ເອກະສານພາສີ ແລະ ຈັດສົ່ງເຖິງໜ້າວຽກ ສຳລັບອຸປະກອນທີ່ຂົນສົ່ງຈາກຈີນມາລາວ.
  client: ລໍຖ້າເພີ່ມຊື່ລູກຄ້າ
  location: ຈີນ → ລາວ
  body: |-
    ## ຄວາມຕ້ອງການຂອງລູກຄ້າ
    ຜູ້ຮັບເໝົາໂຄງການຕ້ອງການຂົນສົ່ງອຸປະກອນຈາກຈີນ ໄປຫາໜ້າວຽກໃນລາວ ຕາມກຳນົດເວລາທີ່ແນ່ນອນ.

    ## ສິ່ງທີ່ພວກເຮົາເຮັດ
    - ປຽບທຽບທາງເລືອກທາງລົດໄຟ ແລະ ທາງບົກ ທັງຕົ້ນທຶນ ແລະ ເວລາຂົນສົ່ງ
    - ກະກຽມເອກະສານການຄ້າ ແລະ ພາສີ
    - ປະສານງານການຜ່ານພາສີທີ່ດ່ານ ແລະ ການຈັດສົ່ງເຖິງໜ້າວຽກ

    ## ຜົນໄດ້ຮັບ
    ອະທິບາຍຜົນໄດ້ຮັບຢູ່ບ່ອນນີ້.
