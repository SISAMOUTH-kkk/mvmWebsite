la:
  title: ແປສັນຍາ ແລະ ໃບອະນຸຍາດ ຈີນ–ລາວ
  summary: ແປ ແລະ ຈັດຮູບແບບຊຸດສັນຍາ ແລະ ໃບອະນຸຍາດປະກອບ ເພື່ອຍື່ນຕໍ່ພາກລັດ.
  client: ລໍຖ້າເພີ່ມຊື່ລູກຄ້າ
  location: ນະຄອນຫຼວງວຽງຈັນ
  body: |-
    ## ຄວາມຕ້ອງການຂອງລູກຄ້າ
    ບໍລິສັດໜຶ່ງຕ້ອງການແປສັນຍາ ແລະ ໃບອະນຸຍາດພາສາຈີນເປັນພາສາລາວ ແລະ ຈັດຮູບແບບເພື່ອຍື່ນ.

    ## ສິ່ງທີ່ພວກເຮົາເຮັດ
    - ຕົກລົງລາຍການຊື່ ແລະ ຄຳສັບເຕັກນິກກັບລູກຄ້າ
    - ແປ ແລະ ຈັດຮູບແບບແຕ່ລະເອກະສານໃຫ້ກົງກັບຕົ້ນສະບັບ
    - ກວດທານຊື່, ຕົວເລກ ແລະ ວັນທີ ເປັນຄັ້ງທີສອງ

    ## ຜົນໄດ້ຮັບ
    ອະທິບາຍຜົນໄດ້ຮັບຢູ່ບ່ອນນີ້.
