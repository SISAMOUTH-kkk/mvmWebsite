la:
  title: ທັດສະນະສຶກສາສຳລັບນັກລົງທຶນໃນລາວ
  summary: ກຳນົດການຫຼາຍມື້ ລວມການຢ້ຽມຢາມບໍລິສັດ, ການປະຊຸມ ແລະ ການເດີນທາງ ສຳລັບຄະນະນັກລົງທຶນ.
  client: ລໍຖ້າເພີ່ມຊື່ລູກຄ້າ
  location: ວຽງຈັນ ແລະ ພາກເໜືອຂອງລາວ
  body: |-
    ## ຄວາມຕ້ອງການຂອງລູກຄ້າ
    ຄະນະນັກລົງທຶນຕ້ອງການເບິ່ງໂອກາດທາງທຸລະກິດໃນລາວ ໃນການເດີນທາງຄັ້ງດຽວທີ່ຈັດການຢ່າງດີ.

    ## ສິ່ງທີ່ພວກເຮົາເຮັດ
    - ສ້າງກຳນົດການຢ້ຽມຢາມບໍລິສັດ, ຟາມ ແລະ ເຂດເສດຖະກິດ
    - ຈັດພາຫະນະ, ໂຮງແຮມ ແລະ ລ່າມ
    - ກະກຽມຂໍ້ມູນສະຫຼຸບກ່ອນແຕ່ລະການຢ້ຽມຢາມ ແລະ ຕິດຕາມຜູ້ຕິດຕໍ່ຫຼັງຈາກນັ້ນ

    ## ຜົນໄດ້ຮັບ
    ອະທິບາຍຜົນໄດ້ຮັບຢູ່ບ່ອນນີ້.
