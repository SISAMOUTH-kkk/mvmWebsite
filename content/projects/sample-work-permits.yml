la:
  title: ໃບອະນຸຍາດເຮັດວຽກ ແລະ ບັດພັກເຊົາ ສຳລັບທີມງານໂຄງການ
  summary: ໃບອະນຸຍາດສຳລັບວິສະວະກອນ ແລະ ຜູ້ຈັດການຕ່າງປະເທດ ທີ່ເຂົ້າມາເຮັດວຽກໂຄງການໃນລາວ ພ້ອມປະຕິທິນການຕໍ່ອາຍຸ.
  client: ລໍຖ້າເພີ່ມຊື່ລູກຄ້າ
  location: ສປປ ລາວ
  body: |-
    ## ຄວາມຕ້ອງການຂອງລູກຄ້າ
    ບໍລິສັດໂຄງການຕ້ອງການໃບອະນຸຍາດເຮັດວຽກ ແລະ ບັດພັກເຊົາ ສຳລັບພະນັກງານຕ່າງປະເທດ ທີ່ເດີນທາງມາເປັນຫຼາຍກຸ່ມ.

    ## ສິ່ງທີ່ພວກເຮົາເຮັດ
    - ກະກຽມລາຍການເອກະສານສຳລັບພະນັກງານແຕ່ລະຄົນ
    - ແປ ແລະ ຢັ້ງຢືນເອກະສານປະກອບ
    - ຍື່ນຄຳຮ້ອງ ແລະ ຕິດຕາມກັບຫ້ອງການທີ່ຮັບຜິດຊອບ
    - ສ້າງປະຕິທິນການຕໍ່ອາຍຸສຳລັບທັງທີມ

    ## ຜົນໄດ້ຮັບ
    ອະທິບາຍຜົນໄດ້ຮັບຢູ່ບ່ອນນີ້.
zh:
  title: 为项目团队办理工作许可与居留许可
