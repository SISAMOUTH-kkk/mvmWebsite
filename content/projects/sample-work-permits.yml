  client: 客户名称待补充
  location: 老挝
  body: |-
    ## 项目需求
    一家项目公司需要为分批抵达的外籍员工办理工作许可和居留许可。

    ## 我们的工作
    - 为每位员工准备文件清单
    - 翻译并认证随附文件
    - 递交申请并与主管部门跟进
    - 为整个团队建立续期日历

    ## 成果
    在此描述项目成果。
