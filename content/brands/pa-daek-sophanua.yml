la:
  title: ປາແດກໂສພານົວ
  seo_title: ປາແດກໂສພານົວ — ແບຣນປາແດກລາວ ໃນເຄືອ MVM GROUP
  seo_description: >-
    ປາແດກໂສພານົວ (Pa Daek Sophanua, 索法努阿鱼酱) ແມ່ນແບຣນປາແດກລາວ ທີ່ MVM GROUP ພັດທະນາ ແລະ ຈັດຈຳໜ່າຍ.
    ລາຍການສິນຄ້າ, ວິທີໃຊ້, ຈຸດຈຳໜ່າຍ ແລະ ການສະໝັກເປັນຕົວແທນຈຳໜ່າຍ.
  tagline: ລົດຊາດທີ່ເປັນຫົວໃຈຂອງອາຫານລາວ ບັນຈຸມາເພື່ອເຮືອນຄົວທຸກມື້ນີ້.
  summary: ປາແດກ ເຄື່ອງປຸງຫຼັກຂອງອາຫານລາວ ໃນແບຣນທີ່ສ້າງມາສຳລັບຄົວເຮືອນ, ຮ້ານອາຫານ ແລະ ການສົ່ງອອກ.
  story: |-
    ປາແດກແມ່ນເຄື່ອງປຸງທີ່ເຮັດໃຫ້ອາຫານລາວມີລົດຊາດເລິກເຊິ່ງ. ຄອບຄົວລາວເຮັດປາແດກສືບທອດກັນມາຫຼາຍລຸ້ນ ແລະ ໃຊ້ໃນຕຳໝາກຫຸ່ງ, ແຈ່ວ, ແກງ ແລະ ອາຫານອື່ນໆ ທົ່ວປະເທດ.

    ປາແດກໂສພານົວ ນຳເອົາວັດຖຸດິບປະຈຳວັນນີ້ ມາສູ່ຊັ້ນວາງສິນຄ້າທີ່ທັນສະໄໝ ພາຍໃຕ້ແບຣນທີ່ຈື່ຈຳງ່າຍ ເພື່ອໃຫ້ແມ່ຄົວ, ຮ້ານອາຫານ ແລະ ຜູ້ຊື້ຕ່າງປະເທດ ໄດ້ສິນຄ້າທີ່ມີຄຸນນະພາບສະໝ່ຳສະເໝີ.
  concept: |-
    ລົດຊາດດັ້ງເດີມ, ບັນຈຸພັນຊັດເຈນ. ແບຣນນີ້ຮັກສາລົດຊາດທີ່ແມ່ຄົວລາວຄຸ້ນເຄີຍ ແລະ ນຳສະເໜີດ້ວຍສະຫຼາກພາສາລາວ, ອັງກິດ ແລະ ຈີນ ສຳລັບຮ້ານຄ້າທັງພາຍໃນ ແລະ ຕະຫຼາດໃກ້ຄຽງ.
  highlights:
    - title: ເຄື່ອງປຸງຫຼັກຂອງອາຫານລາວ
      text: ພື້ນຖານຂອງຕຳໝາກຫຸ່ງ, ແຈ່ວ, ແກງ ແລະ ອາຫານປະເພດຕ່າງໆ.
    - title: ລົດຊາດນົວ ເຂັ້ມຂົ້ນ
      text: ລົດຊາດປາໝັກທີ່ເຂັ້ມຂົ້ນ ພຽງບ່ວງດຽວກໍປຸງອາຫານໄດ້ທັງຈານ.
    - title: ບັນຈຸສຳລັບຮ້ານຄ້າ ແລະ ເຮືອນຄົວ
      text: ບັນຈຸພັນທີ່ປິດສະໜິດ ສຳລັບແມ່ຄົວ, ຮ້ານອາຫານ ແລະ ທຸລະກິດອາຫານ.
    - title: ພ້ອມສົ່ງອອກ
      text: ສະຫຼາກພາສາລາວ, ອັງກິດ ແລະ ຈີນ ສຳລັບຜູ້ຊື້ໃນພາກພື້ນ.
  products:
    - name: ສິນຄ້າ 1
      description: ລໍຖ້າເພີ່ມຊື່ ແລະ ລາຍລະອຽດສິນຄ້າ.
      size: ລໍຖ້າເພີ່ມຂະໜາດ
