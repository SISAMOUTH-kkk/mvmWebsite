  tagline: The taste at the heart of Lao cooking, packed for today's kitchens.
  summary: Pa daek, the fermented fish seasoning at the heart of Lao food, in a brand made for homes, restaurants and export.
  story: |-
    Pa daek is the seasoning that gives Lao food its depth. Families have made it for generations, and it goes into papaya salad, jeow dipping sauces, soups and curries across the country.

    Pa Daek Sophanua brings that everyday ingredient to modern shelves under a recognisable brand, so home cooks, restaurants and buyers abroad can find a consistent product.
  concept: |-
    Traditional taste, clear packaging. The brand keeps the flavour Lao cooks expect and presents it with labelling in Lao, English and Chinese for shops at home and in neighbouring markets.
