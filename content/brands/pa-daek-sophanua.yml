      size: ລໍຖ້າເພີ່ມຂະໜາດ
    - name: ສິນຄ້າ 3
      description: ລໍຖ້າເພີ່ມຊື່ ແລະ ລາຍລະອຽດສິນຄ້າ.
      size: ລໍຖ້າເພີ່ມຂະໜາດ
  usage:
    - title: ປຸງຕຳໝາກຫຸ່ງ
      text: ໃສ່ໜຶ່ງບ່ວງໃນຕຳໝາກຫຸ່ງ ເພື່ອລົດຊາດລາວແບບດັ້ງເດີມ.
    - title: ເຮັດແຈ່ວ
      text: ປະສົມກັບໝາກເຜັດ, ກະທຽມ ແລະ ຜັກຫອມ ກິນກັບເຂົ້າໜຽວ ແລະ ຜັກ.
    - title: ປຸງແກງ ແລະ ອາຫານຕົ້ມ
      text: ໃສ່ໃນນ້ຳແກງ, ແກງ ແລະ ອາຫານຕົ້ມ ໃນລະຫວ່າງປຸງແຕ່ງ.
    - title: ປຸງໃຫ້ສຸກກ່ອນກິນ
      text: ຖ້າສະຫຼາກບໍ່ໄດ້ລະບຸວ່າກິນໄດ້ທັນທີ, ກະລຸນາປຸງປາແດກໃຫ້ສຸກກ່ອນກິນ ແລະ ເກັບຮັກສາຕາມຄຳແນະນຳເທິງບັນຈຸພັນ.
zh:
  title: 索法努阿鱼酱
  seo_title: 索法努阿鱼酱 — MVM 集团旗下老挝鱼酱品牌
  seo_description: >-
    索法努阿鱼酱（Pa Daek Sophanua，ປາແດກໂສພານົວ）是由 MVM 集团开发和分销的老挝鱼酱品牌。
    了解产品、食用方法、销售网点及经销商申请。
  tagline: 老挝菜的灵魂风味，为现代厨房而包装。
  summary: 老挝鱼酱（Pa Daek）是老挝菜的核心调味料，这一品牌面向家庭、餐厅及出口市场。
  story: |-
    老挝鱼酱（Pa Daek）是由鱼发酵而成、赋予老挝菜醇厚风味的调味料。老挝家庭世代自制，广泛用于青木瓜沙拉、蘸酱、汤和咖喱等菜肴。

    索法努阿鱼酱将这一日常食材以易于识别的品牌带上现代货架，让家庭厨师、餐厅和海外买家都能买到品质稳定的产品。
  concept: |-
    传统风味，清晰包装。品牌保留老挝厨师熟悉的味道，并配以老挝语、英语和中文标签，适合国内及周边市场的商店销售。
  highlights:
    - title: 老挝菜的必备调料
      text: 青木瓜沙拉、蘸酱、汤和咖喱的基础调味。
    - title: 浓郁鲜香
      text: 发酵鱼的浓郁风味，一勺即可为整道菜调味。
    - title: 适合商店与厨房的包装
      text: 密封包装，适合家庭、餐厅和食品企业。
    - title: 适合出口
      text: 老挝语、英语和中文标签，便于区域买家选购。
  products:
    - name: 产品 1
      description: 产品名称和介绍待补充。
      size: 规格待补充
    - name: 产品 2
      description: 产品名称和介绍待补充。
      size: 规格待补充
    - name: 产品 3
      description: 产品名称和介绍待补充。
      size: 规格待补充
  usage:
    - title: 调味青木瓜沙拉
      text: 在青木瓜沙拉中加入一勺，带来经典老挝风味。
    - title: 制作蘸酱
      text: 与辣椒、大蒜和香草混合，搭配糯米饭和蔬菜食用。
    - title: 为汤和咖喱调味
      text: 烹饪时加入高汤、咖喱或炖菜中。
    - title: 煮熟后食用
      text: 除非标签注明可直接食用，请将鱼酱煮熟后再食用，并按包装上的说明储存。
