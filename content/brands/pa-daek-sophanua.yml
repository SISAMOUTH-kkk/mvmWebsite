    - title: Deep, savoury flavour
      text: Rich fermented-fish taste that seasons a whole dish with a spoonful.
    - title: Packed for shops and kitchens
      text: Sealed packs for home cooks, restaurants and food businesses.
    - title: Ready for export
      text: Labels in Lao, English and Chinese for buyers in the region.
