  tagline: A yogurt with a Lao name and an everyday place on the table.
  summary: A yogurt brand from Laos, named after the elephant, the country's best-known symbol.
  story: |-
    Laos was once called Lan Xang, the Land of a Million Elephants. Big Elephant Yogurt takes its name from that heritage: a strong, friendly symbol that every Lao family recognises.

    The brand was created by MVM GROUP to offer a yogurt that feels local, is easy to find and fits into daily routines, from breakfast to an afternoon snack.
  concept: |-
    Simple, fresh and familiar. Big Elephant Yogurt pairs a clean, modern pack with a name and mascot that speak to Lao customers first, while the Lao, English and Chinese names make it easy to recognise for visitors and partners.
  highlights:
    - title: Rooted in Laos
      text: A name that recalls Lan Xang, the Land of a Million Elephants.
    - title: Made for every day
      text: Smooth yogurt to enjoy on its own, with fruit or as part of breakfast.
    - title: Kept cold to the shelf
      text: Distributed through a chilled supply chain to arrive fresh.
    - title: Easy to stock
      text: Packs and cartons planned for shops, cafés and supermarkets.
