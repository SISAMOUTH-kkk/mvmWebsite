zh:
  title: 大象酸奶
  seo_title: 大象酸奶 — MVM 集团旗下品牌
  seo_description: >-
    大象酸奶（Big Elephant Yogurt，ໂຢເກີດທ໌ ຊ້າງໃຫຍ່）是由 MVM 集团开发和分销的老挝酸奶品牌。
    了解口味、规格、销售网点及经销商申请。
  tagline: 一款拥有老挝名字、天天出现在餐桌上的酸奶。
  summary: 来自老挝的酸奶品牌，以老挝最具代表性的象征——大象命名。
  story: |-
    老挝古称“澜沧”，意为“百万大象之国”。大象酸奶的名字正源于这一传统：一个每个老挝家庭都熟悉的、强壮而亲切的象征。

    MVM 集团创立这一品牌，希望提供一款有本地亲切感、容易买到、适合日常生活的酸奶，无论是早餐还是午后小食。
  concept: |-
    简单、新鲜、亲切。大象酸奶将现代简洁的包装与首先面向老挝消费者的名字和吉祥物相结合，同时以老挝语、英语和中文三种名称，方便游客和合作伙伴识别。
  highlights:
    - title: 源自老挝
      text: 品牌名称让人联想到“澜沧”——百万大象之国。
    - title: 适合每一天
      text: 口感顺滑，可直接食用、搭配水果或作为早餐的一部分。
    - title: 冷链直达货架
      text: 通过冷链配送，确保新鲜到达。
    - title: 便于铺货
      text: 包装及外箱规格适合商店、咖啡馆和超市。
  flavors:
    - name: 口味 1
      note: 名称待补充
    - name: 口味 2
      note: 名称待补充
    - name: 口味 3
      note: 名称待补充
  sizes:
    - name: 规格 1
      note: 容量待补充
    - name: 规格 2
      note: 容量待补充
