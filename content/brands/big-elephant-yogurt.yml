la:
  title: ໂຢເກີດທ໌ ຊ້າງໃຫຍ່
  seo_title: ໂຢເກີດທ໌ ຊ້າງໃຫຍ່ — ແບຣນໃນເຄືອ MVM GROUP
  seo_description: >-
    ໂຢເກີດທ໌ ຊ້າງໃຫຍ່ (Big Elephant Yogurt, 大象酸奶) ແມ່ນແບຣນໂຢເກີດຈາກລາວ ທີ່ MVM GROUP ພັດທະນາ ແລະ
    ຈັດຈຳໜ່າຍ. ລົດຊາດ, ຂະໜາດ, ຈຸດຈຳໜ່າຍ ແລະ ການສະໝັກເປັນຕົວແທນຈຳໜ່າຍ.
  tagline: ໂຢເກີດທີ່ມີຊື່ລາວ ແລະ ມີບ່ອນຢູ່ເທິງໂຕະອາຫານທຸກວັນ.
  summary: ແບຣນໂຢເກີດຈາກລາວ ທີ່ຕັ້ງຊື່ຕາມຊ້າງ ເຊິ່ງເປັນສັນຍາລັກທີ່ຮູ້ຈັກກັນດີທີ່ສຸດຂອງປະເທດ.
  story: |-
    ລາວເຄີຍມີຊື່ວ່າ ລ້ານຊ້າງ, ດິນແດນແຫ່ງຊ້າງລ້ານໂຕ. ໂຢເກີດທ໌ ຊ້າງໃຫຍ່ ຕັ້ງຊື່ຕາມມໍລະດົກນັ້ນ: ສັນຍາລັກທີ່ເຂັ້ມແຂງ ແລະ ເປັນມິດ ທີ່ທຸກຄອບຄົວລາວຮູ້ຈັກ.

    MVM GROUP ສ້າງແບຣນນີ້ຂຶ້ນ ເພື່ອສະເໜີໂຢເກີດທີ່ມີຄວາມເປັນທ້ອງຖິ່ນ, ຊອກຊື້ງ່າຍ ແລະ ເໝາະກັບຊີວິດປະຈຳວັນ ຕັ້ງແຕ່ອາຫານເຊົ້າ ຈົນເຖິງອາຫານຫວ່າງຕອນບ່າຍ.
  concept: |-
    ງ່າຍ, ສົດ ແລະ ຄຸ້ນເຄີຍ. ໂຢເກີດທ໌ ຊ້າງໃຫຍ່ ປະສົມບັນຈຸພັນທີ່ທັນສະໄໝ ເຂົ້າກັບຊື່ ແລະ ມາສະຄອດ ທີ່ສື່ສານກັບລູກຄ້າລາວກ່ອນ, ໃນຂະນະທີ່ຊື່ພາສາລາວ, ອັງກິດ ແລະ ຈີນ ຊ່ວຍໃຫ້ນັກທ່ອງທ່ຽວ ແລະ ຄູ່ຮ່ວມງານຈື່ຈຳໄດ້ງ່າຍ.
  highlights:
    - title: ມີຮາກຖານຈາກລາວ
      text: ຊື່ທີ່ລະນຶກເຖິງ ລ້ານຊ້າງ, ດິນແດນແຫ່ງຊ້າງລ້ານໂຕ.
    - title: ເໝາະສຳລັບທຸກວັນ
      text: ໂຢເກີດນຸ່ມນວນ ກິນເປົ່າໆ, ກິນກັບໝາກໄມ້ ຫຼື ເປັນສ່ວນໜຶ່ງຂອງອາຫານເຊົ້າ.
    - title: ຮັກສາຄວາມເຢັນຈົນເຖິງຊັ້ນວາງ
      text: ຈັດຈຳໜ່າຍຜ່ານລະບົບຂົນສົ່ງຄວາມເຢັນ ເພື່ອໃຫ້ຮອດມືລູກຄ້າຢ່າງສົດໃໝ່.
    - title: ວາງຂາຍງ່າຍ
      text: ບັນຈຸພັນ ແລະ ລັງ ອອກແບບມາສຳລັບຮ້ານຄ້າ, ຄາເຟ ແລະ ຊຸບເປີມາເກັດ.
