# About page. Edit in the CMS: Pages → About.
en:
  seo_title: About MVM GROUP
  seo_description: >-
    MVM GROUP is a Lao business group with units in business and government services, travel, trade and logistics,
    and consumer brands. Vision, mission, strengths, leadership and company registration.
  hero_title: A Lao business group built on partnership
  hero_lead: >-
    MVM GROUP brings business services, travel, trade and its own consumer brands together under one group,
    so partners in Laos, China and beyond can work with a single, accountable team.
  statement: We help others do business in Laos, and we build Lao brands of our own.
  story: |-
    Companies coming to Laos usually need several services at once: company registration, permits, translation, travel and shipping. When each piece is handled by a different supplier, details get lost between them.

    MVM GROUP brings these services together. Our business units share one coordination team, one network of partners and one standard of service, from a single translated document to a full market-entry project.

    Alongside our services, we develop consumer brands. Building and distributing products of our own keeps us close to Lao retailers and consumers, and gives our clients advice based on real experience.
  milestones:
    - year: 20XX
      text: Founding of MVM GROUP (date and details to be added)
    - year: 20XX
      text: Launch of Big Elephant Yogurt (date to be added)
    - year: 20XX
      text: Launch of Pa Daek Sophanua (date to be added)
    - year: "2026"
      text: New group website in Lao, English and Chinese
  vision: >-
    To be the partner people trust when they do business in Laos, and to build Lao brands that are known beyond our borders.
  mission:
    - Make it simple for companies and investors to start and run a business in Laos.
    - Deliver documentation, translation, travel and logistics as one coordinated service.
    - Develop consumer brands that carry Lao taste and quality to new markets.
    - Connect partners in Laos, China and other countries through honest, long-term relationships.
  goals:
    - Extend our services and partner network to more provinces of Laos.
    - Grow distribution of our brands in Laos and neighbouring markets.
    - Add new business units as the group grows, such as transportation, media, technology, real estate and investment.
    - Build a team with strong language skills and deep local knowledge.
  strengths_intro: What sets the group apart for clients and partners.
  strengths:
    - title: One group, many capabilities
      text: Consulting, documentation, translation, travel, logistics and trading under one coordinator.
    - title: A multilingual team
      text: Daily work in Lao, Chinese, Thai and English.
    - title: Experience with authorities
      text: Working with ministries and provincial offices is part of our everyday business.
    - title: Cross-border network
      text: Partners in Laos, China and neighbouring countries for people, goods and documents.
    - title: Brand-building experience
      text: We develop and distribute our own products, not only advise on them.
    - title: Any size of project
      text: From one translated certificate to a complete market-entry programme.
  units_intro: Each unit focuses on one area of work and shares the group's coordination, languages and network.
  cooperation_intro: MVM GROUP works as a bridge between Laos, China and international partners.
  cooperation:
    - title: Laos
      text: Our home market. We know its regulations, its provinces and its consumers.
    - title: China
      text: Chinese-speaking staff and partners support investors, traders and travellers from China, including along the Laos–China Railway corridor.
    - title: International
      text: We work with Thai, Vietnamese and other international companies entering Laos or sourcing from it.
  areas:
    - name: Vientiane Capital
      text: Head office and main service team (address to be added).
    - name: Provinces across Laos
      text: Documentation, travel and distribution coordinated with provincial offices and partners.
    - name: Border gateways
      text: Cross-border logistics through checkpoints with China, Thailand and Vietnam.
    - name: China and the region
      text: Partners and clients in China, Thailand and other neighbouring markets.
  team_intro: Profiles of the leadership team will be published here.
la:
  seo_title: ກ່ຽວກັບ MVM GROUP
  seo_description: >-
    MVM GROUP ແມ່ນກຸ່ມທຸລະກິດລາວ ທີ່ມີໜ່ວຍທຸລະກິດດ້ານບໍລິການທຸລະກິດ ແລະ ເອກະສານທາງລັດ, ທ່ອງທ່ຽວ, ການຄ້າ
    ແລະ ໂລຈິສຕິກ ແລະ ແບຣນສິນຄ້າບໍລິໂພກ.
  hero_title: ກຸ່ມທຸລະກິດລາວ ທີ່ສ້າງຂຶ້ນບົນພື້ນຖານການຮ່ວມມື
  hero_lead: >-
    MVM GROUP ລວມບໍລິການທຸລະກິດ, ການທ່ອງທ່ຽວ, ການຄ້າ ແລະ ແບຣນສິນຄ້າຂອງຕົນເອງ ໄວ້ພາຍໃຕ້ກຸ່ມບໍລິສັດດຽວ
    ເພື່ອໃຫ້ຄູ່ຮ່ວມງານໃນລາວ, ຈີນ ແລະ ສາກົນ ເຮັດວຽກກັບທີມດຽວທີ່ຮັບຜິດຊອບຢ່າງຊັດເຈນ.
  statement: ພວກເຮົາຊ່ວຍຜູ້ອື່ນເຮັດທຸລະກິດໃນລາວ ແລະ ສ້າງແບຣນລາວຂອງພວກເຮົາເອງ.
  story: |-
    ບໍລິສັດທີ່ເຂົ້າມາລາວ ມັກຕ້ອງການຫຼາຍບໍລິການພ້ອມກັນ: ການຈົດທະບຽນບໍລິສັດ, ໃບອະນຸຍາດ, ການແປພາສາ, ການເດີນທາງ ແລະ ການຂົນສົ່ງ. ເມື່ອແຕ່ລະວຽກຖືກດູແລໂດຍຜູ້ໃຫ້ບໍລິການຕ່າງເຈົ້າ, ລາຍລະອຽດມັກຕົກຫຼົ່ນລະຫວ່າງກັນ.

    MVM GROUP ລວມບໍລິການເຫຼົ່ານີ້ເຂົ້າກັນ. ໜ່ວຍທຸລະກິດຂອງພວກເຮົາໃຊ້ທີມປະສານງານດຽວກັນ, ເຄືອຂ່າຍຄູ່ຮ່ວມງານດຽວກັນ ແລະ ມາດຕະຖານການບໍລິການດຽວກັນ ຕັ້ງແຕ່ການແປເອກະສານສະບັບດຽວ ຈົນເຖິງໂຄງການເຂົ້າສູ່ຕະຫຼາດຄົບວົງຈອນ.

    ນອກຈາກການບໍລິການ, ພວກເຮົາຍັງພັດທະນາແບຣນສິນຄ້າບໍລິໂພກ. ການສ້າງ ແລະ ຈັດຈຳໜ່າຍສິນຄ້າຂອງຕົນເອງ ເຮັດໃຫ້ພວກເຮົາໃກ້ຊິດກັບຮ້ານຄ້າ ແລະ ຜູ້ບໍລິໂພກລາວ ແລະ ໃຫ້ຄຳແນະນຳແກ່ລູກຄ້າໂດຍອີງໃສ່ປະສົບການຕົວຈິງ.
  milestones:
    - year: 20XX
      text: ການສ້າງຕັ້ງ MVM GROUP (ລໍຖ້າເພີ່ມວັນທີ ແລະ ລາຍລະອຽດ)
    - year: 20XX
      text: ເປີດຕົວ ໂຢເກີດທ໌ ຊ້າງໃຫຍ່ (ລໍຖ້າເພີ່ມວັນທີ)
    - year: 20XX
      text: ເປີດຕົວ ປາແດກໂສພານົວ (ລໍຖ້າເພີ່ມວັນທີ)
    - year: "2026"
      text: ເວັບໄຊໃໝ່ຂອງກຸ່ມບໍລິສັດ ເປັນພາສາລາວ, ອັງກິດ ແລະ ຈີນ
  vision: >-
    ເປັນຄູ່ຮ່ວມງານທີ່ຜູ້ຄົນໄວ້ວາງໃຈ ເມື່ອເຮັດທຸລະກິດໃນລາວ ແລະ ສ້າງແບຣນລາວໃຫ້ເປັນທີ່ຮູ້ຈັກໄປໄກກວ່າຊາຍແດນຂອງພວກເຮົາ.
  mission:
    - ເຮັດໃຫ້ບໍລິສັດ ແລະ ນັກລົງທຶນ ເລີ່ມຕົ້ນ ແລະ ດຳເນີນທຸລະກິດໃນລາວໄດ້ງ່າຍຂຶ້ນ.
    - ໃຫ້ບໍລິການເອກະສານ, ການແປພາສາ, ການທ່ອງທ່ຽວ ແລະ ໂລຈິສຕິກ ເປັນບໍລິການດຽວທີ່ປະສານງານກັນ.
    - ພັດທະນາແບຣນສິນຄ້າບໍລິໂພກ ທີ່ນຳລົດຊາດ ແລະ ຄຸນນະພາບແບບລາວ ສູ່ຕະຫຼາດໃໝ່.
    - ເຊື່ອມຕໍ່ຄູ່ຮ່ວມງານໃນລາວ, ຈີນ ແລະ ປະເທດອື່ນໆ ດ້ວຍສາຍພົວພັນທີ່ຊື່ສັດ ແລະ ຍາວນານ.
  goals:
    - ຂະຫຍາຍການບໍລິການ ແລະ ເຄືອຂ່າຍຄູ່ຮ່ວມງານ ໄປສູ່ແຂວງຕ່າງໆຂອງລາວຫຼາຍຂຶ້ນ.
    - ຂະຫຍາຍການຈັດຈຳໜ່າຍແບຣນຂອງພວກເຮົາໃນລາວ ແລະ ຕະຫຼາດປະເທດໃກ້ຄຽງ.
    - ເພີ່ມໜ່ວຍທຸລະກິດໃໝ່ຕາມການເຕີບໂຕຂອງກຸ່ມ ເຊັ່ນ ການຂົນສົ່ງ, ສື່, ເຕັກໂນໂລຊີ, ອະສັງຫາລິມະຊັບ ແລະ ການລົງທຶນ.
    - ສ້າງທີມງານທີ່ມີຄວາມສາມາດດ້ານພາສາ ແລະ ຄວາມຮູ້ທ້ອງຖິ່ນຢ່າງເລິກເຊິ່ງ.
  strengths_intro: ສິ່ງທີ່ເຮັດໃຫ້ກຸ່ມບໍລິສັດຂອງພວກເຮົາແຕກຕ່າງ ສຳລັບລູກຄ້າ ແລະ ຄູ່ຮ່ວມງານ.
  strengths:
    - title: ກຸ່ມດຽວ ຫຼາຍຄວາມສາມາດ
      text: ທີ່ປຶກສາ, ເອກະສານ, ການແປ, ການທ່ອງທ່ຽວ, ໂລຈິສຕິກ ແລະ ການຄ້າ ພາຍໃຕ້ຜູ້ປະສານງານຄົນດຽວ.
    - title: ທີມງານຫຼາຍພາສາ
      text: ເຮັດວຽກເປັນພາສາລາວ, ຈີນ, ໄທ ແລະ ອັງກິດ ທຸກວັນ.
    - title: ປະສົບການກັບພາກລັດ
      text: ການເຮັດວຽກກັບກະຊວງ ແລະ ຫ້ອງການແຂວງ ເປັນສ່ວນໜຶ່ງຂອງວຽກປະຈຳວັນຂອງພວກເຮົາ.
    - title: ເຄືອຂ່າຍຂ້າມແດນ
      text: ຄູ່ຮ່ວມງານໃນລາວ, ຈີນ ແລະ ປະເທດໃກ້ຄຽງ ສຳລັບການເຄື່ອນຍ້າຍຄົນ, ສິນຄ້າ ແລະ ເອກະສານ.
    - title: ປະສົບການສ້າງແບຣນ
      text: ພວກເຮົາພັດທະນາ ແລະ ຈັດຈຳໜ່າຍສິນຄ້າຂອງຕົນເອງ ບໍ່ແມ່ນພຽງແຕ່ໃຫ້ຄຳແນະນຳ.
    - title: ທຸກຂະໜາດໂຄງການ
      text: ຕັ້ງແຕ່ການແປໃບຢັ້ງຢືນສະບັບດຽວ ຈົນເຖິງໂຄງການເຂົ້າສູ່ຕະຫຼາດຄົບວົງຈອນ.
  units_intro: ແຕ່ລະໜ່ວຍເນັ້ນໃສ່ວຽກດ້ານໜຶ່ງ ແລະ ໃຊ້ການປະສານງານ, ພາສາ ແລະ ເຄືອຂ່າຍຮ່ວມກັນຂອງກຸ່ມ.
  cooperation_intro: MVM GROUP ເຮັດໜ້າທີ່ເປັນຂົວເຊື່ອມລະຫວ່າງລາວ, ຈີນ ແລະ ຄູ່ຮ່ວມງານສາກົນ.
  cooperation:
    - title: ລາວ
      text: ຕະຫຼາດບ້ານເກີດຂອງພວກເຮົາ. ພວກເຮົາຮູ້ຈັກລະບຽບການ, ແຂວງຕ່າງໆ ແລະ ຜູ້ບໍລິໂພກຂອງລາວ.
    - title: ຈີນ
      text: ພະນັກງານ ແລະ ຄູ່ຮ່ວມງານທີ່ເວົ້າພາສາຈີນ ສະໜັບສະໜູນນັກລົງທຶນ, ພໍ່ຄ້າ ແລະ ນັກເດີນທາງຈາກຈີນ ລວມທັງຕາມແລວທາງລົດໄຟລາວ-ຈີນ.
    - title: ສາກົນ
      text: ພວກເຮົາເຮັດວຽກກັບບໍລິສັດໄທ, ຫວຽດນາມ ແລະ ບໍລິສັດສາກົນອື່ນໆ ທີ່ເຂົ້າມາລາວ ຫຼື ຈັດຫາສິນຄ້າຈາກລາວ.
  areas:
    - name: ນະຄອນຫຼວງວຽງຈັນ
      text: ສຳນັກງານໃຫຍ່ ແລະ ທີມບໍລິການຫຼັກ (ລໍຖ້າເພີ່ມທີ່ຢູ່).
    - name: ແຂວງຕ່າງໆທົ່ວລາວ
      text: ເອກະສານ, ການທ່ອງທ່ຽວ ແລະ ການຈັດຈຳໜ່າຍ ປະສານງານກັບຫ້ອງການແຂວງ ແລະ ຄູ່ຮ່ວມງານ.
    - name: ດ່ານຊາຍແດນ
      text: ໂລຈິສຕິກຂ້າມແດນຜ່ານດ່ານກັບຈີນ, ໄທ ແລະ ຫວຽດນາມ.
    - name: ຈີນ ແລະ ພາກພື້ນ
      text: ຄູ່ຮ່ວມງານ ແລະ ລູກຄ້າໃນຈີນ, ໄທ ແລະ ຕະຫຼາດປະເທດໃກ້ຄຽງອື່ນໆ.
  team_intro: ຂໍ້ມູນທີມບໍລິຫານຈະຖືກເຜີຍແຜ່ຢູ່ບ່ອນນີ້.
zh:
  seo_title: 关于 MVM 集团
  seo_description: >-
    MVM 集团是一家老挝企业集团，业务板块涵盖商务与政府事务服务、旅游、贸易与物流以及消费品牌。
  hero_title: 以合作为本的老挝企业集团
  hero_lead: >-
    MVM 集团将商务服务、旅游、贸易及自有消费品牌整合于同一集团之下，让老挝、中国及国际合作伙伴
    与一个负责任的团队直接合作。
  statement: 我们帮助他人在老挝开展业务，也打造属于自己的老挝品牌。
  story: |-
    来到老挝的企业通常同时需要多项服务：公司注册、许可证、翻译、出行和运输。当每个环节由不同的供应商负责时，细节往往在交接中遗漏。

    MVM 集团将这些服务整合在一起。我们的各业务板块共享同一个协调团队、同一个合作伙伴网络和同一套服务标准，从一份文件翻译到完整的市场进入项目都能胜任。

    除服务之外，我们还开发消费品牌。打造和分销自有产品，使我们贴近老挝零售商和消费者，也让我们给客户的建议建立在真实经验之上。
  milestones:
    - year: 20XX
      text: MVM 集团成立（日期和详情待补充）
    - year: 20XX
      text: 大象酸奶上市（日期待补充）
    - year: 20XX
      text: 索法努阿鱼酱上市（日期待补充）
    - year: "2026"
      text: 集团老挝语、英语、中文新网站上线
  vision: 成为人们在老挝开展业务时值得信赖的合作伙伴，并打造享誉海外的老挝品牌。
  mission:
    - 让企业和投资者在老挝创业和经营变得更简单。
    - 将文件办理、翻译、旅游和物流整合为一项协调统一的服务。
    - 开发消费品牌，将老挝风味与品质带入新市场。
    - 以诚信和长期合作连接老挝、中国及其他国家的合作伙伴。
  goals:
    - 将服务和合作伙伴网络拓展到老挝更多省份。
    - 扩大旗下品牌在老挝及周边市场的分销。
    - 随着集团发展增设新的业务板块，如交通运输、传媒、科技、房地产和投资。
    - 打造语言能力强、熟悉本地情况的团队。
  strengths_intro: 我们为客户和合作伙伴带来的独特优势。
  strengths:
    - title: 一个集团，多项能力
      text: 咨询、文件、翻译、旅游、物流和贸易由一位协调人统筹。
    - title: 多语种团队
      text: 日常使用老挝语、中文、泰语和英语工作。
    - title: 熟悉政府事务
      text: 与各部委和省级部门打交道是我们的日常工作。
    - title: 跨境网络
      text: 在老挝、中国及周边国家拥有协调人员、货物和文件的合作伙伴。
    - title: 品牌打造经验
      text: 我们不仅提供建议，还亲自开发和分销自有产品。
    - title: 项目规模灵活
      text: 从一份证书翻译到完整的市场进入方案。
  units_intro: 每个板块专注于一个领域，同时共享集团的协调、语言和网络资源。
  cooperation_intro: MVM 集团是连接老挝、中国与国际合作伙伴的桥梁。
  cooperation:
    - title: 老挝
      text: 我们的本土市场。我们熟悉这里的法规、各省情况和消费者。
    - title: 中国
      text: 会说中文的员工和合作伙伴为来自中国的投资者、贸易商和旅客提供支持，包括中老铁路沿线。
    - title: 国际
      text: 我们与进入老挝或从老挝采购的泰国、越南及其他国际企业合作。
  areas:
    - name: 万象首都
      text: 总部及主要服务团队（地址待补充）。
    - name: 老挝各省
      text: 与省级部门和合作伙伴协调文件、旅游和分销事务。
    - name: 边境口岸
      text: 通过与中国、泰国和越南接壤的口岸开展跨境物流。
    - name: 中国及周边地区
      text: 在中国、泰国及其他周边市场的合作伙伴和客户。
  team_intro: 管理团队简介将在此发布。
