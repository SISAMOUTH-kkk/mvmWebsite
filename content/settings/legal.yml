# Privacy policy and terms of use. Have these reviewed by your legal adviser before launch.
en:
  updated: 2026-10-17
  privacy_title: Privacy policy
  privacy_body: |-
    This policy explains how MVM GROUP ("we", "us") collects and uses personal information through this website.

    ## Information we collect

    - **Details you send us** through our contact, quotation and partnership forms, such as your name, company, country, phone number, email, WeChat ID and the content of your message.
    - **Usage information** collected by analytics tools when they are enabled, such as pages visited, device type and approximate location.

    ## How we use it

    We use your details to reply to your request, prepare quotations, provide our services, manage distributor and partner applications, and improve this website. We do not sell your personal information.

    ## Sharing

    We share information only with staff and partners who need it to handle your request, and with service providers that host this website and process form submissions on our behalf. We may disclose information when required by law.

    ## Cookies and analytics

    This website may use cookies and similar technologies from Google Analytics and Meta to understand how the site is used and to measure advertising. You can block cookies in your browser settings.

    ## Storage and security

    We keep your information only as long as needed for the purposes above and take reasonable measures to protect it.

    ## Your choices

    You can ask us to access, correct or delete your personal information by contacting us through the [contact page](/en/contact/).

    ## Changes

    We may update this policy. The date at the top of the page shows the latest version.
  terms_title: Terms of use
  terms_body: |-
    By using this website you agree to these terms.

    ## Information on this website

    Content on this website is general information about MVM GROUP and its services and brands. It is not legal, tax or investment advice. Requirements, timelines and prices depend on each case and are confirmed in a written quotation.

    ## Quotations and services

    Services are provided under the quotation or agreement issued for each project. Nothing on this website is an offer that can be accepted to form a contract.

    ## Intellectual property

    The MVM GROUP name, logo, brand names, text, images and design of this website belong to MVM GROUP or its licensors. Do not copy or use them without written permission.

    ## Links to other websites

    We are not responsible for the content of other websites linked from this site.

    ## Liability

    We take care to keep this website accurate but do not guarantee that it is complete or always available. To the extent permitted by law, we are not liable for losses arising from use of this website.

    ## Governing law

    These terms are governed by the laws of the Lao People's Democratic Republic.

    ## Contact

    Questions about these terms can be sent through the [contact page](/en/contact/).
la:
  privacy_title: ນະໂຍບາຍຄວາມເປັນສ່ວນຕົວ
  privacy_body: |-
    ນະໂຍບາຍນີ້ອະທິບາຍວ່າ MVM GROUP ("ພວກເຮົາ") ເກັບກຳ ແລະ ນຳໃຊ້ຂໍ້ມູນສ່ວນບຸກຄົນຜ່ານເວັບໄຊນີ້ແນວໃດ.

    ## ຂໍ້ມູນທີ່ພວກເຮົາເກັບກຳ

    - **ຂໍ້ມູນທີ່ທ່ານສົ່ງຫາພວກເຮົາ** ຜ່ານແບບຟອມຕິດຕໍ່, ຂໍໃບສະເໜີລາຄາ ແລະ ການຮ່ວມມື ເຊັ່ນ ຊື່, ບໍລິສັດ, ປະເທດ, ເບີໂທ, ອີເມວ, WeChat ID ແລະ ເນື້ອໃນຂໍ້ຄວາມ.
    - **ຂໍ້ມູນການນຳໃຊ້** ທີ່ເຄື່ອງມືວິເຄາະເກັບກຳ ເມື່ອເປີດໃຊ້ງານ ເຊັ່ນ ໜ້າທີ່ເຂົ້າຊົມ, ປະເພດອຸປະກອນ ແລະ ທີ່ຕັ້ງໂດຍປະມານ.

    ## ພວກເຮົານຳໃຊ້ຂໍ້ມູນແນວໃດ

    ພວກເຮົາໃຊ້ຂໍ້ມູນຂອງທ່ານເພື່ອຕອບຄຳຮ້ອງ, ກະກຽມໃບສະເໜີລາຄາ, ໃຫ້ບໍລິການ, ຄຸ້ມຄອງໃບສະໝັກຕົວແທນຈຳໜ່າຍ ແລະ ຄູ່ຮ່ວມງານ ແລະ ປັບປຸງເວັບໄຊນີ້. ພວກເຮົາບໍ່ຂາຍຂໍ້ມູນສ່ວນບຸກຄົນຂອງທ່ານ.

    ## ການແບ່ງປັນຂໍ້ມູນ

    ພວກເຮົາແບ່ງປັນຂໍ້ມູນສະເພາະກັບພະນັກງານ ແລະ ຄູ່ຮ່ວມງານທີ່ຈຳເປັນຕ້ອງໃຊ້ເພື່ອດຳເນີນຄຳຮ້ອງຂອງທ່ານ ແລະ ກັບຜູ້ໃຫ້ບໍລິການທີ່ໂຮດເວັບໄຊ ແລະ ປະມວນຜົນແບບຟອມແທນພວກເຮົາ. ພວກເຮົາອາດເປີດເຜີຍຂໍ້ມູນເມື່ອກົດໝາຍກຳນົດ.

    ## ຄຸກກີ້ ແລະ ການວິເຄາະ

    ເວັບໄຊນີ້ອາດໃຊ້ຄຸກກີ້ ແລະ ເຕັກໂນໂລຊີທີ່ຄ້າຍຄືກັນ ຈາກ Google Analytics ແລະ Meta ເພື່ອເຂົ້າໃຈການນຳໃຊ້ເວັບໄຊ ແລະ ວັດຜົນການໂຄສະນາ. ທ່ານສາມາດປິດຄຸກກີ້ໄດ້ໃນການຕັ້ງຄ່າບຣາວເຊີ.

    ## ການເກັບຮັກສາ ແລະ ຄວາມປອດໄພ

    ພວກເຮົາເກັບຮັກສາຂໍ້ມູນຂອງທ່ານໄວ້ພຽງເທົ່າທີ່ຈຳເປັນສຳລັບຈຸດປະສົງຂ້າງເທິງ ແລະ ມີມາດຕະການທີ່ເໝາະສົມເພື່ອປົກປ້ອງຂໍ້ມູນ.

    ## ສິດຂອງທ່ານ

    ທ່ານສາມາດຂໍເບິ່ງ, ແກ້ໄຂ ຫຼື ລຶບຂໍ້ມູນສ່ວນບຸກຄົນຂອງທ່ານ ໂດຍຕິດຕໍ່ພວກເຮົາຜ່ານ[ໜ້າຕິດຕໍ່](/la/contact/).

    ## ການປ່ຽນແປງ

    ພວກເຮົາອາດປັບປຸງນະໂຍບາຍນີ້. ວັນທີຢູ່ເທິງສຸດຂອງໜ້າ ສະແດງສະບັບລ່າສຸດ.
  terms_title: ຂໍ້ກຳນົດການນຳໃຊ້
  terms_body: |-
    ການນຳໃຊ້ເວັບໄຊນີ້ ຖືວ່າທ່ານຍອມຮັບຂໍ້ກຳນົດເຫຼົ່ານີ້.

    ## ຂໍ້ມູນໃນເວັບໄຊ

    ເນື້ອຫາໃນເວັບໄຊນີ້ແມ່ນຂໍ້ມູນທົ່ວໄປກ່ຽວກັບ MVM GROUP, ການບໍລິການ ແລະ ແບຣນຂອງພວກເຮົາ. ບໍ່ແມ່ນຄຳແນະນຳດ້ານກົດໝາຍ, ພາສີ ຫຼື ການລົງທຶນ. ເງື່ອນໄຂ, ໄລຍະເວລາ ແລະ ລາຄາ ຂຶ້ນກັບແຕ່ລະກໍລະນີ ແລະ ຈະຢືນຢັນໃນໃບສະເໜີລາຄາເປັນລາຍລັກອັກສອນ.

    ## ໃບສະເໜີລາຄາ ແລະ ການບໍລິການ

    ການບໍລິການແມ່ນສະໜອງຕາມໃບສະເໜີລາຄາ ຫຼື ສັນຍາທີ່ອອກໃຫ້ແຕ່ລະໂຄງການ. ບໍ່ມີເນື້ອຫາໃດໃນເວັບໄຊນີ້ທີ່ເປັນຂໍ້ສະເໜີເພື່ອສ້າງສັນຍາ.

    ## ຊັບສິນທາງປັນຍາ

    ຊື່ MVM GROUP, ໂລໂກ້, ຊື່ແບຣນ, ຂໍ້ຄວາມ, ຮູບພາບ ແລະ ການອອກແບບເວັບໄຊນີ້ ເປັນຂອງ MVM GROUP ຫຼື ຜູ້ໃຫ້ສິດ. ຫ້າມສຳເນົາ ຫຼື ນຳໃຊ້ໂດຍບໍ່ໄດ້ຮັບອະນຸຍາດເປັນລາຍລັກອັກສອນ.

    ## ລິ້ງໄປຫາເວັບໄຊອື່ນ

    ພວກເຮົາບໍ່ຮັບຜິດຊອບຕໍ່ເນື້ອຫາຂອງເວັບໄຊອື່ນທີ່ເຊື່ອມຕໍ່ຈາກເວັບໄຊນີ້.

    ## ຄວາມຮັບຜິດຊອບ

    ພວກເຮົາພະຍາຍາມຮັກສາຄວາມຖືກຕ້ອງຂອງເວັບໄຊນີ້ ແຕ່ບໍ່ຮັບປະກັນວ່າຈະຄົບຖ້ວນ ຫຼື ໃຊ້ງານໄດ້ຕະຫຼອດເວລາ. ເທົ່າທີ່ກົດໝາຍອະນຸຍາດ, ພວກເຮົາບໍ່ຮັບຜິດຊອບຕໍ່ຄວາມເສຍຫາຍທີ່ເກີດຈາກການນຳໃຊ້ເວັບໄຊນີ້.

    ## ກົດໝາຍທີ່ນຳໃຊ້

    ຂໍ້ກຳນົດເຫຼົ່ານີ້ຢູ່ພາຍໃຕ້ກົດໝາຍຂອງ ສາທາລະນະລັດ ປະຊາທິປະໄຕ ປະຊາຊົນລາວ.

    ## ຕິດຕໍ່

    ຄຳຖາມກ່ຽວກັບຂໍ້ກຳນົດເຫຼົ່ານີ້ ສາມາດສົ່ງຜ່ານ[ໜ້າຕິດຕໍ່](/la/contact/).
zh:
  privacy_title: 隐私政策
  privacy_body: |-
    本政策说明 MVM 集团（“我们”）如何通过本网站收集和使用个人信息。

    ## 我们收集的信息

    - **您提交的信息**：通过联系、报价及合作表单提交的姓名、公司、国家/地区、电话、邮箱、微信号及留言内容。
    - **使用信息**：在启用分析工具时收集的访问页面、设备类型及大致位置等信息。

    ## 信息用途

    我们使用您的信息回复您的请求、准备报价、提供服务、处理经销商及合作伙伴申请，并改进本网站。我们不会出售您的个人信息。

    ## 信息共享

    我们仅与处理您请求所需的员工和合作伙伴，以及代表我们托管网站和处理表单的服务商共享信息。在法律要求时，我们可能披露相关信息。

    ## Cookie 与数据分析

    本网站可能使用 Google Analytics 和 Meta 的 Cookie 及类似技术，以了解网站使用情况并衡量广告效果。您可以在浏览器设置中禁用 Cookie。

    ## 存储与安全

    我们仅在上述目的所需期间保存您的信息，并采取合理措施加以保护。

    ## 您的权利

    您可以通过[联系页面](/zh/contact/)要求查阅、更正或删除您的个人信息。

    ## 政策更新

    我们可能更新本政策。页面顶部的日期为最新版本日期。
  terms_title: 使用条款
  terms_body: |-
    使用本网站即表示您同意以下条款。

    ## 网站信息

    本网站内容为关于 MVM 集团及其服务和品牌的一般性信息，不构成法律、税务或投资建议。具体要求、时间和价格因个案而异，以书面报价为准。

    ## 报价与服务

    服务依据为每个项目出具的报价或协议提供。本网站任何内容均不构成可据以成立合同的要约。

    ## 知识产权

    MVM 集团名称、标志、品牌名称以及本网站的文字、图片和设计归 MVM 集团或其许可方所有。未经书面许可，不得复制或使用。

    ## 外部链接

    对于本网站链接的其他网站内容，我们不承担责任。

    ## 责任限制

    我们尽力确保本网站内容准确，但不保证其完整或始终可用。在法律允许的范围内，我们对因使用本网站而产生的损失不承担责任。

    ## 适用法律

    本条款受老挝人民民主共和国法律管辖。

    ## 联系我们

    如对本条款有疑问，请通过[联系页面](/zh/contact/)与我们联系。
